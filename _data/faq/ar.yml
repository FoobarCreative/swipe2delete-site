title: الأسئلة الشائعة
description: "إجابات عن الأسئلة الشائعة حول Swipe2delete: كيف يعمل حذف الصور بالسحب، واستعادة الصور المحذوفة، وتحرير مساحة التخزين على iPhone وفي iCloud، والخصوصية، والأسعار."
outro: هل لديك سؤال آخر؟ [تواصل معنا](/contact){:target="_self"} وسنسعد بمساعدتك.
items:
  - q: كيف يعمل Swipe2delete؟
    a: >-
      يعرض لك Swipe2delete مكتبة صورك صورةً صورة، وشهرًا بعد شهر. اسحب لليسار لحذف
      الصورة، واسحب لليمين للاحتفاظ بها. وعند إنهاء كل دفعة، تحصل على مراجعة نهائية
      لكل ما حددته للحذف قبل إزالة أي شيء. هكذا يتحول تنظيف آلاف الصور إلى مهمة
      سريعة، بل وممتعة بصراحة.
  - q: هل Swipe2delete مجاني؟
    a: >-
      يمكنك تنزيل Swipe2delete وتجربته مجانًا. يفتح لك Premium التنظيف غير المحدود،
      ويمكنك الاختيار بين اشتراك أو شراء لمرة واحدة مدى الحياة، فلن تكون مضطرًا
      أبدًا إلى دفع مبلغ متكرر للحفاظ على مكتبة صور نظيفة.
  - q: هل يمكنني استعادة صور حذفتها عن طريق الخطأ؟
    a: >-
      نعم، وبطريقتين. داخل التطبيق، اضغط على تراجع لاستعادة الصورة التي سحبتها للتو
      فورًا. ولأن Swipe2delete يعمل مع مكتبة صور Apple، فإن كل ما يُحذف ينتقل إلى
      ألبوم **المحذوفة مؤخرًا** في تطبيق الصور، حيث يبقى حتى 30 يومًا قبل إزالته
      نهائيًا. افتح تطبيق الصور، ثم الألبومات، ثم المحذوفة مؤخرًا لاستعادة الصور في
      أي وقت خلال هذه المدة.
  - q: هل يؤدي حذف الصور إلى تحرير مساحة على iPhone؟
    a: >-
      نعم. عادةً ما تكون الصور ولقطات الشاشة من أكبر ما يملأ مساحة iPhone. بعد
      تنظيف كل شهر، يعرض لك Swipe2delete بالضبط كم وفّرت من المساحة. ولتحرير
      المساحة فورًا، قم أيضًا بـ[إفراغ ألبوم المحذوفة
      مؤخرًا](/ar/guides/empty-recently-deleted){:target="_self"} في تطبيق الصور. وإلا
      فسيحرر iOS المساحة تلقائيًا بعد 30 يومًا.
  - q: حذفت صورًا لكن لا توجد مساحة خالية بعد. لماذا؟
    a: >-
      صورك محذوفة، لكن iOS يحتفظ بها لأجلك. عندما تحذف صورًا على iPhone، سواء عبر
      Swipe2delete أو أي تطبيق آخر، تنتقل إلى ألبوم **المحذوفة مؤخرًا** في تطبيق
      الصور، حيث تبقى حتى 30 يومًا كشبكة أمان. لا تتحرر المساحة إلا بعد إفراغ هذا
      الألبوم، إما تلقائيًا بعد 30 يومًا أو يدويًا الآن. إليك دليلنا الذي لا يستغرق
      دقيقة: [كيفية إفراغ المحذوفة مؤخرًا وتحرير المساحة
      فورًا](/ar/guides/empty-recently-deleted){:target="_self"}.
  - q: هل تُحذف الصور من iCloud أيضًا؟
    a: >-
      إذا كنت تستخدم صور iCloud، فستبقى مكتبتك متزامنة، أي أن الصورة التي تحذفها
      عبر Swipe2delete تُزال أيضًا من iCloud ومن أجهزتك الأخرى (بعد انتهاء مدة
      المحذوفة مؤخرًا). وهذا يعني أن تنظيف مكتبة صورك يحرر أيضًا مساحة في iCloud،
      وقد يغنيك عن الدفع مقابل سعة iCloud أكبر.
  - q: هل صوري خاصة؟ هل يرفع Swipe2delete صوري إلى أي مكان؟
    a: >-
      صورك لا تغادر جهازك أبدًا. يعمل Swipe2delete مباشرةً مع مكتبة الصور على
      iPhone. لا يوجد حساب، ولا يتم رفع صورك إلى أي خادم. راجع [سياسة
      الخصوصية](/privacy-policy){:target="_self"} لمزيد من التفاصيل.
  - q: ما أسرع طريقة لتنظيف مكتبة صور ضخمة؟
    a: >-
      لا تحاول إنجاز كل شيء دفعة واحدة، فهكذا تُهجر مشاريع التنظيف. يقسّم
      Swipe2delete مكتبتك إلى أشهر، لتنجز شهرًا واحدًا كلما توفرت لديك دقيقة.
      يُحفظ تقدمك لكل شهر، وتعرض عجلة التقدم كم أنجزت، وتعيد ميزة **في هذا اليوم**
      صورًا من سنوات مضت حتى تتخلص من الفوضى القديمة أيضًا.
  - q: ما الفرق بينه وبين حذف الصور في تطبيق الصور؟
    a: >-
      في تطبيق الصور عليك تحديد كل صورة على حدة، ومن السهل أن تضغط على الصورة
      الخطأ دون خطوة مراجعة. أما Swipe2delete فمصمم لمهمة واحدة بالضبط: اتخاذ قرار
      سريع بالاحتفاظ أو الحذف. سحبة واحدة لكل صورة، وزر تراجع، ومراجعة نهائية قبل
      حذف أي شيء، ومتابعة للتقدم حتى تُنهي المهمة فعلًا. وقد حذف المستخدمون أكثر
      من 27 مليون صورة بالتطبيق.
