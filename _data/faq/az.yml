title: Tez-tez verilən suallar
description: "Swipe2delete haqqında ən çox verilən sualların cavabları: sürüşdürərək şəkil silmə necə işləyir, silinmiş şəkillərin bərpası, iPhone və iCloud yaddaşında yer boşaltma, məxfilik və qiymətlər."
outro: Başqa sualınız var? [Bizə yazın](/contact){:target="_self"}, məmnuniyyətlə kömək edərik.
items:
  - q: Swipe2delete necə işləyir?
    a: >-
      Swipe2delete qalereyanızı bir-bir şəkil, bir-bir ay göstərir. Şəkli silmək
      üçün sola, saxlamaq üçün sağa sürüşdürün. Dəstəni bitirəndə, hər hansı şəkil
      silinməzdən əvvəl silinmə üçün işarələdiyiniz hər şeyə son dəfə baxırsınız.
      Beləliklə minlərlə şəklin təmizlənməsi sürətli və düzü, hətta əyləncəli bir
      işə çevrilir.
  - q: Swipe2delete pulsuzdur?
    a: >-
      Swipe2delete-i pulsuz endirib sınaya bilərsiniz. Premium limitsiz təmizləməni
      açır və abunəlik ya da birdəfəlik ömürlük alış arasında seçim edə bilərsiniz.
      Yəni qalereyanızı təmiz saxlamaq üçün heç vaxt təkrarlanan ödənişə bağlı
      qalmırsınız.
  - q: Təsadüfən sildiyim şəkilləri bərpa edə bilərəm?
    a: >-
      Bəli, həm də iki yolla. Tətbiqin içində geri al düyməsinə toxunub indicə
      sürüşdürdüyünüz şəkli dərhal geri qaytarın. Swipe2delete Apple-ın foto
      kitabxanası ilə işlədiyi üçün silinən hər şey Photos tətbiqindəki **Son
      Silinmiş** albomuna gedir və birdəfəlik silinməzdən əvvəl 30 günə qədər orada
      qalır. Bu müddət ərzində şəkilləri istənilən vaxt bərpa etmək üçün Photos →
      Albomlar → Son Silinmiş bölməsini açın.
  - q: Şəkilləri silmək iPhone yaddaşında yer boşaldır?
    a: >-
      Bəli. Şəkillər və ekran görüntüləri adətən iPhone yaddaşını ən çox dolduran
      şeylərdəndir. Bir ayı təmizlədikdən sonra Swipe2delete nə qədər yer qənaət
      etdiyinizi dəqiq göstərir. Yerin dərhal boşalması üçün Photos tətbiqində [Son
      Silinmiş albomunu da boşaldın](/guides/empty-recently-deleted){:target="_self"}.
      Əks halda iOS 30 gündən sonra yeri avtomatik boşaldır.
  - q: Şəkilləri sildim, amma yenə də boş yer yoxdur. Niyə?
    a: >-
      Şəkilləriniz silinib, amma iOS onları hələ də sizin üçün saxlayır. iPhone-da
      şəkil siləndə, istər Swipe2delete, istərsə də başqa tətbiqlə, onlar Photos
      tətbiqindəki **Son Silinmiş** albomuna gedir və təhlükəsizlik toru kimi 30
      günə qədər orada qalır. Yaddaş yalnız bu albom boşaldılanda azad olur: ya 30
      gündən sonra avtomatik, ya da elə indi əl ilə. Bir dəqiqəlik bələdçimizə
      baxın: [Son Silinmiş albomunu boşaldıb yeri dərhal necə azad etmək
      olar](/guides/empty-recently-deleted){:target="_self"}.
  - q: Şəkillər iCloud-dan da silinəcək?
    a: >-
      iCloud Photos istifadə edirsinizsə, kitabxananız sinxron qalır. Yəni
      Swipe2delete ilə sildiyiniz şəkil (Son Silinmiş müddəti bitdikdən sonra)
      iCloud-dan və digər cihazlarınızdan da silinir. Beləliklə qalereyanı
      təmizləmək iCloud yaddaşında da yer boşaldır və sizi daha böyük iCloud
      planına pul verməkdən xilas edə bilər.
  - q: Şəkillərim məxfidir? Swipe2delete onları harasa yükləyir?
    a: >-
      Şəkilləriniz cihazınızı heç vaxt tərk etmir. Swipe2delete birbaşa
      iPhone-unuzdakı foto kitabxanası ilə işləyir. Hesab yoxdur və şəkilləriniz
      heç bir serverə yüklənmir. Ətraflı məlumat üçün [məxfilik
      siyasətimizə](/privacy-policy){:target="_self"} baxın.
  - q: Nəhəng qalereyanı təmizləməyin ən sürətli yolu nədir?
    a: >-
      Hər şeyi bir dəfəyə etməyə çalışmayın. Təmizlik işləri məhz belə yarımçıq
      qalır. Swipe2delete kitabxananızı aylara bölür, beləcə boş dəqiqəniz olanda
      bir ayı bitirə bilərsiniz. İrəliləyişiniz hər ay üzrə yadda saxlanılır,
      irəliləyiş çarxı nə qədər yol getdiyinizi göstərir, **Bu gündə** funksiyası
      isə keçmiş illərin şəkillərini üzə çıxarır ki, köhnə qarışıqlıq da
      təmizlənsin.
  - q: Bunun Photos tətbiqində şəkil silməkdən fərqi nədir?
    a: >-
      Photos tətbiqində hər şəkli tək-tək seçmək lazımdır, səhv şəklə toxunmaq
      asandır və yoxlama addımı yoxdur. Swipe2delete isə tam olaraq bir iş üçün
      qurulub: saxla ya sil qərarını sürətlə vermək. Hər şəklə bir sürüşdürmə, geri
      al düyməsi, hər hansı şey silinməzdən əvvəl son baxış və işi həqiqətən
      bitirməyiniz üçün irəliləyiş izləmə. İnsanlar onunla artıq 27 milyondan çox
      şəkil silib.
