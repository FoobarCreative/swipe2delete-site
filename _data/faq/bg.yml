title: Често задавани въпроси
description: "Отговори на често задавани въпроси за Swipe2delete: как работи изтриването на снимки с плъзгане, възстановяване на изтрити снимки, освобождаване на място на iPhone и в iCloud, поверителност и цени."
outro: Имате още въпрос? [Пишете ни](/contact){:target="_self"} и с удоволствие ще помогнем.
items:
  - q: Как работи Swipe2delete?
    a: >-
      Swipe2delete ви показва галерията снимка по снимка, месец по месец. Плъзнете
      наляво, за да изтриете снимка, и надясно, за да я запазите. Когато приключите с
      една порция, получавате финален преглед на всичко, което сте маркирали за
      изтриване, преди нещо да бъде премахнато. Така разчистването на хиляди снимки
      става бързо и, честно казано, дори забавно.
  - q: Безплатен ли е Swipe2delete?
    a: >-
      Swipe2delete се изтегля и пробва безплатно. Premium отключва неограничено
      разчистване, като можете да изберете между абонамент или еднократна доживотна
      покупка. Така не сте обвързани с повтарящо се плащане, за да поддържате
      галерията си чиста.
  - q: Мога ли да възстановя случайно изтрити снимки?
    a: >-
      Да, и то по два начина. В приложението докоснете „Отмени“ и веднага ще върнете
      снимката, която току-що сте плъзнали. И понеже Swipe2delete използва фототеката
      на Apple, всичко изтрито отива в албума **Наскоро изтрити** в приложението
      Снимки, където остава до 30 дни, преди да бъде премахнато окончателно. Отворете
      Снимки → Албуми → Наскоро изтрити, за да възстановите снимки по всяко време в
      този период.
  - q: Освобождава ли изтриването на снимки място на моя iPhone?
    a: >-
      Да. Снимките и екранните снимки обикновено са сред нещата, които заемат
      най-много място на един iPhone. След като разчистите един месец, Swipe2delete
      показва точно колко място сте спестили. За да се освободи мястото веднага,
      [изпразнете и албума Наскоро
      изтрити](/guides/empty-recently-deleted){:target="_self"} в приложението
      Снимки. В противен случай iOS го освобождава автоматично след 30 дни.
  - q: Изтрих снимки, но все още няма свободно място. Защо?
    a: >-
      Снимките ви са изтрити, но iOS все още ги пази за вас. Когато изтривате снимки
      на iPhone, със Swipe2delete или с което и да е друго приложение, те отиват в
      албума **Наскоро изтрити** в приложението Снимки, където стоят до 30 дни като
      предпазна мярка. Мястото не се освобождава, докато този албум не бъде
      изпразнен: автоматично след 30 дни или ръчно още сега. Вижте нашето ръководство
      за една минута: [как да изпразните Наскоро изтрити и да освободите място
      веднага](/guides/empty-recently-deleted){:target="_self"}.
  - q: Ще бъдат ли изтрити снимките и от iCloud?
    a: >-
      Ако използвате Снимки в iCloud, библиотеката ви остава синхронизирана, така че
      снимка, изтрита със Swipe2delete, се премахва и от iCloud, и от другите ви
      устройства (след периода на Наскоро изтрити). Това означава, че разчистването
      на галерията освобождава и място в iCloud, което може да ви спести плащането за
      по-голям план на iCloud.
  - q: Поверителни ли са снимките ми? Качва ли ги Swipe2delete някъде?
    a: >-
      Снимките ви никога не напускат устройството. Swipe2delete работи директно с
      фототеката на вашия iPhone. Няма акаунт и снимките ви не се качват на ничий
      сървър. Вижте нашата [политика за
      поверителност](/privacy-policy){:target="_self"} за подробности.
  - q: Кой е най-бързият начин да разчистя огромна галерия?
    a: >-
      Не се опитвайте да направите всичко наведнъж. Точно така разчистванията се
      изоставят. Swipe2delete разделя библиотеката ви на месеци, за да можете да
      приключите един месец винаги когато имате свободна минута. Напредъкът се
      запазва за всеки месец, колело на напредъка показва докъде сте стигнали, а
      функцията **На този ден** връща снимки от минали години, така че и старият
      безпорядък да бъде разчистен.
  - q: По какво се различава от изтриването на снимки в приложението Снимки?
    a: >-
      В приложението Снимки трябва да докосвате и избирате всяка снимка поотделно,
      лесно е да уцелите грешната и няма стъпка за финален преглед. Swipe2delete е
      създаден точно за една задача: бързо да решавате дали да запазите, или да
      изтриете. Едно плъзгане на снимка, бутон за отмяна, финален преглед, преди нещо
      да бъде изтрито, и проследяване на напредъка, за да стигнете наистина до края.
      Хората вече са изтрили над 27 милиона снимки с него.
