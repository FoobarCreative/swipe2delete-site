title: Συχνές ερωτήσεις
description: "Απαντήσεις σε συχνές ερωτήσεις για το Swipe2delete: πώς λειτουργεί η διαγραφή φωτογραφιών με σύρσιμο, ανάκτηση διαγραμμένων φωτογραφιών, απελευθέρωση χώρου σε iPhone και iCloud, απόρρητο και τιμές."
outro: Έχετε ακόμα κάποια απορία; [Επικοινωνήστε μαζί μας](/contact){:target="_self"} και θα χαρούμε να βοηθήσουμε.
items:
  - q: Πώς λειτουργεί το Swipe2delete;
    a: >-
      Το Swipe2delete σας δείχνει τη συλλογή σας μία φωτογραφία τη φορά, έναν μήνα τη
      φορά. Σύρετε αριστερά για να διαγράψετε μια φωτογραφία, δεξιά για να την
      κρατήσετε. Όταν ολοκληρώσετε μια παρτίδα, κάνετε έναν τελικό έλεγχο σε όσα
      σημειώσατε για διαγραφή, πριν αφαιρεθεί οτιδήποτε. Έτσι το ξεκαθάρισμα χιλιάδων
      φωτογραφιών γίνεται γρήγορο και, ειλικρινά, αρκετά διασκεδαστικό.
  - q: Είναι δωρεάν το Swipe2delete;
    a: >-
      Το Swipe2delete κατεβαίνει και δοκιμάζεται δωρεάν. Το Premium ξεκλειδώνει
      απεριόριστο καθαρισμό και μπορείτε να επιλέξετε ανάμεσα σε συνδρομή ή μία
      εφάπαξ αγορά εφ' όρου ζωής. Δεν χρειάζεται λοιπόν να δεσμευτείτε σε
      επαναλαμβανόμενη πληρωμή για να κρατάτε τη συλλογή σας καθαρή.
  - q: Μπορώ να ανακτήσω φωτογραφίες που διέγραψα κατά λάθος;
    a: >-
      Ναι, και μάλιστα με δύο τρόπους. Μέσα στην εφαρμογή, πατήστε αναίρεση για να
      επαναφέρετε αμέσως μια φωτογραφία που μόλις σύρατε. Κι επειδή το Swipe2delete
      χρησιμοποιεί τη βιβλιοθήκη φωτογραφιών της Apple, ό,τι διαγράφεται πηγαίνει στο
      άλμπουμ **Πρόσφατα διαγραμμένα** της εφαρμογής Φωτογραφίες, όπου μένει έως 30
      ημέρες πριν αφαιρεθεί οριστικά. Ανοίξτε Φωτογραφίες → Άλμπουμ → Πρόσφατα
      διαγραμμένα για να επαναφέρετε φωτογραφίες οποιαδήποτε στιγμή μέσα σε αυτό το
      διάστημα.
  - q: Η διαγραφή φωτογραφιών ελευθερώνει χώρο στο iPhone μου;
    a: >-
      Ναι. Οι φωτογραφίες και τα στιγμιότυπα οθόνης είναι συνήθως από τα πράγματα που
      γεμίζουν περισσότερο ένα iPhone. Αφού καθαρίσετε έναν μήνα, το Swipe2delete σας
      δείχνει ακριβώς πόσο χώρο εξοικονομήσατε. Για να ανακτηθεί ο χώρος αμέσως,
      [αδειάστε και το άλμπουμ Πρόσφατα
      διαγραμμένα](/el/guides/empty-recently-deleted){:target="_self"} στην εφαρμογή
      Φωτογραφίες. Διαφορετικά, το iOS τον ελευθερώνει αυτόματα μετά από 30 ημέρες.
  - q: Διέγραψα φωτογραφίες αλλά δεν υπάρχει ακόμα ελεύθερος χώρος. Γιατί;
    a: >-
      Οι φωτογραφίες σας έχουν διαγραφεί, αλλά το iOS τις κρατά ακόμα για εσάς. Όποτε
      διαγράφετε φωτογραφίες σε iPhone, με το Swipe2delete ή οποιαδήποτε άλλη
      εφαρμογή, πηγαίνουν στο άλμπουμ **Πρόσφατα διαγραμμένα** της εφαρμογής
      Φωτογραφίες, όπου παραμένουν έως 30 ημέρες ως δίχτυ ασφαλείας. Ο χώρος δεν
      ελευθερώνεται μέχρι να αδειάσει αυτό το άλμπουμ: είτε αυτόματα μετά από 30
      ημέρες είτε χειροκίνητα αμέσως τώρα. Δείτε τον οδηγό μας του ενός λεπτού: [πώς
      να αδειάσετε τα Πρόσφατα διαγραμμένα και να ελευθερώσετε χώρο
      αμέσως](/el/guides/empty-recently-deleted){:target="_self"}.
  - q: Θα διαγραφούν οι φωτογραφίες και από το iCloud;
    a: >-
      Αν χρησιμοποιείτε Φωτογραφίες iCloud, η βιβλιοθήκη σας μένει συγχρονισμένη.
      Έτσι, μια φωτογραφία που διαγράφετε με το Swipe2delete αφαιρείται και από το
      iCloud και από τις άλλες συσκευές σας (μετά την περίοδο των Πρόσφατα
      διαγραμμένων). Αυτό σημαίνει ότι ο καθαρισμός της συλλογής σας ελευθερώνει και
      χώρο στο iCloud, κάτι που μπορεί να σας γλιτώσει από την αγορά ενός μεγαλύτερου
      προγράμματος iCloud.
  - q: Είναι οι φωτογραφίες μου ιδιωτικές; Τις ανεβάζει κάπου το Swipe2delete;
    a: >-
      Οι φωτογραφίες σας δεν φεύγουν ποτέ από τη συσκευή σας. Το Swipe2delete
      δουλεύει απευθείας με τη βιβλιοθήκη φωτογραφιών στο iPhone σας. Δεν υπάρχει
      λογαριασμός ούτε μεταφόρτωση των φωτογραφιών σας σε κανέναν διακομιστή. Δείτε
      τις λεπτομέρειες στην [πολιτική
      απορρήτου](/privacy-policy){:target="_self"} μας.
  - q: Ποιος είναι ο γρηγορότερος τρόπος να καθαρίσω μια τεράστια συλλογή;
    a: >-
      Μην προσπαθήσετε να τα κάνετε όλα μονομιάς. Έτσι εγκαταλείπονται τα
      ξεκαθαρίσματα. Το Swipe2delete χωρίζει τη βιβλιοθήκη σας σε μήνες, ώστε να
      τελειώνετε έναν μήνα όποτε βρίσκετε ένα ελεύθερο λεπτό. Η πρόοδός σας
      αποθηκεύεται ανά μήνα, ένας τροχός προόδου δείχνει πόσο δρόμο έχετε κάνει και η
      λειτουργία **Σήμερα** επαναφέρει φωτογραφίες από παλαιότερα χρόνια, ώστε να
      τακτοποιείται και η παλιά ακαταστασία.
  - q: Σε τι διαφέρει από τη διαγραφή φωτογραφιών στην εφαρμογή Φωτογραφίες;
    a: >-
      Στην εφαρμογή Φωτογραφίες πρέπει να πατάτε και να επιλέγετε κάθε φωτογραφία
      ξεχωριστά, είναι εύκολο να πατήσετε τη λάθος και δεν υπάρχει βήμα τελικού
      ελέγχου. Το Swipe2delete είναι φτιαγμένο για μία ακριβώς δουλειά: να
      αποφασίζετε γρήγορα αν θα κρατήσετε ή θα διαγράψετε. Ένα σύρσιμο ανά
      φωτογραφία, ένα κουμπί αναίρεσης, ένας τελικός έλεγχος πριν διαγραφεί οτιδήποτε
      και παρακολούθηση προόδου για να φτάσετε πραγματικά στο τέλος. Οι χρήστες έχουν
      διαγράψει πάνω από 27 εκατομμύρια φωτογραφίες με αυτό.
