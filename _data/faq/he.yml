title: שאלות נפוצות
description: "תשובות לשאלות נפוצות על Swipe2delete: איך עובדת מחיקת תמונות בהחלקה, שחזור תמונות שנמחקו, פינוי מקום אחסון ב-iPhone וב-iCloud, פרטיות ומחירים."
outro: יש לכם עוד שאלה? [כתבו לנו](/contact){:target="_self"} ונשמח לעזור.
items:
  - q: איך Swipe2delete עובד?
    a: >-
      Swipe2delete מציג את גליל הצילום שלכם תמונה אחר תמונה, חודש אחר חודש. החליקו
      שמאלה כדי למחוק תמונה וימינה כדי לשמור אותה. בסיום כל סבב תקבלו סקירה סופית
      של כל מה שסימנתם למחיקה לפני שמשהו נמחק בפועל. כך ניקוי של אלפי תמונות הופך
      למשימה מהירה, ולמען האמת, גם די כיפית.
  - q: האם Swipe2delete חינמי?
    a: >-
      אפשר להוריד ולנסות את Swipe2delete בחינם. Premium פותח ניקוי ללא הגבלה,
      ואפשר לבחור בין מינוי לרכישה חד-פעמית לכל החיים, כך שאתם אף פעם לא כבולים
      לתשלום חוזר כדי לשמור על גליל צילום נקי.
  - q: אפשר לשחזר תמונות שמחקתי בטעות?
    a: >-
      כן, ואפילו פעמיים. בתוך האפליקציה, הקישו על ביטול כדי להחזיר מיד תמונה שזה
      עתה החלקתם. ומכיוון ש-Swipe2delete עובד עם ספריית התמונות של Apple, כל מה
      שנמחק עובר לאלבום **נמחקו לאחרונה** באפליקציית התמונות, שם הוא נשאר עד 30
      יום לפני שיימחק לצמיתות. פתחו את התמונות, ואז אלבומים, ואז נמחקו לאחרונה כדי
      לשחזר תמונות בכל שלב בתקופה הזו.
  - q: האם מחיקת תמונות מפנה מקום אחסון ב-iPhone?
    a: >-
      כן. תמונות וצילומי מסך הם בדרך כלל מהדברים שממלאים הכי הרבה את ה-iPhone.
      אחרי שמנקים חודש, Swipe2delete מראה בדיוק כמה מקום חסכתם. כדי שהמקום יתפנה
      מיד, [רוקנו גם את האלבום נמחקו
      לאחרונה](/he/guides/empty-recently-deleted){:target="_self"} באפליקציית
      התמונות. אחרת iOS יפנה אותו אוטומטית אחרי 30 יום.
  - q: מחקתי תמונות ועדיין אין מקום פנוי. למה?
    a: >-
      התמונות שלכם נמחקו, אבל iOS עדיין שומר אותן בשבילכם. כשמוחקים תמונות
      ב-iPhone, עם Swipe2delete או כל אפליקציה אחרת, הן עוברות לאלבום **נמחקו
      לאחרונה** באפליקציית התמונות, שם הן נשארות עד 30 יום כרשת ביטחון. המקום
      מתפנה רק כשהאלבום הזה מתרוקן, אוטומטית אחרי 30 יום או ידנית עכשיו. הנה
      המדריך שלנו בדקה אחת: [איך לרוקן את נמחקו לאחרונה ולפנות מקום
      מיד](/he/guides/empty-recently-deleted){:target="_self"}.
  - q: האם תמונות יימחקו גם מ-iCloud?
    a: >-
      אם אתם משתמשים בתמונות iCloud, הספרייה שלכם נשארת מסונכרנת, כך שתמונה
      שמחקתם עם Swipe2delete תוסר גם מ-iCloud ומהמכשירים האחרים שלכם (אחרי תקופת
      נמחקו לאחרונה). כלומר, ניקוי גליל הצילום מפנה גם מקום ב-iCloud ויכול לחסוך
      לכם תשלום על תוכנית iCloud גדולה יותר.
  - q: האם התמונות שלי פרטיות? Swipe2delete מעלה אותן לאנשהו?
    a: >-
      התמונות שלכם אף פעם לא עוזבות את המכשיר. Swipe2delete עובד ישירות מול
      ספריית התמונות ב-iPhone שלכם. אין חשבון ואין העלאה של התמונות לשום שרת.
      פרטים נוספים ב[מדיניות הפרטיות](/privacy-policy){:target="_self"} שלנו.
  - q: מה הדרך המהירה ביותר לנקות גליל צילום ענק?
    a: >-
      אל תנסו לעשות הכול בבת אחת. ככה ניקויים ננטשים. Swipe2delete מחלק את
      הספרייה לחודשים, כך שאפשר לסגור חודש בכל פעם שיש דקה פנויה. ההתקדמות נשמרת
      לכל חודש, גלגל התקדמות מראה כמה כבר עשיתם, והתכונה **ביום הזה** מציפה
      תמונות משנים עברו כדי שגם הבלגן הישן יטופל.
  - q: במה זה שונה ממחיקת תמונות באפליקציית התמונות?
    a: >-
      באפליקציית התמונות צריך להקיש ולבחור כל תמונה בנפרד, קל ללחוץ על הלא נכונה
      ואין שלב סקירה. Swipe2delete בנוי למשימה אחת בדיוק: להחליט מהר אם לשמור או
      למחוק. החלקה אחת לכל תמונה, כפתור ביטול, סקירה סופית לפני שמשהו נמחק ומעקב
      התקדמות כדי שבאמת תסיימו. עד היום נמחקו איתו יותר מ-27 מיליון תמונות.
