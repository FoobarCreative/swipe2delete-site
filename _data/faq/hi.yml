title: अक्सर पूछे जाने वाले सवाल
description: "Swipe2delete के बारे में आम सवालों के जवाब: स्वाइप करके फ़ोटो डिलीट करना कैसे काम करता है, डिलीट हुई फ़ोटो वापस पाना, iPhone और iCloud स्टोरेज खाली करना, प्राइवेसी और क़ीमत।"
outro: कोई और सवाल है? [हमसे संपर्क करें](/contact){:target="_self"}, हमें आपकी मदद करके ख़ुशी होगी।
items:
  - q: Swipe2delete कैसे काम करता है?
    a: >-
      Swipe2delete आपका कैमरा रोल एक बार में एक फ़ोटो, एक महीना करके दिखाता है। बाईं ओर स्वाइप करके फ़ोटो डिलीट करें, दाईं ओर स्वाइप करके रखें। जब आप एक बैच पूरा कर लेते हैं, तो कुछ भी हटने से पहले आपको डिलीट के लिए चुनी गई सभी फ़ोटो की अंतिम समीक्षा मिलती है। हज़ारों फ़ोटो की सफ़ाई झटपट हो जाती है और सच कहें तो इसमें मज़ा भी आता है।
  - q: क्या Swipe2delete मुफ़्त है?
    a: >-
      Swipe2delete डाउनलोड करना और आज़माना मुफ़्त है। Premium से असीमित सफ़ाई अनलॉक होती है, और आप सब्सक्रिप्शन या एक बार की लाइफटाइम ख़रीद में से चुन सकते हैं, यानी कैमरा रोल साफ़ रखने के लिए आपको किसी बार-बार कटने वाले भुगतान में बँधना नहीं पड़ता।
  - q: क्या मैं ग़लती से डिलीट हुई फ़ोटो वापस पा सकता हूँ?
    a: >-
      हाँ, वह भी दो तरह से। ऐप के अंदर, अनडू टैप करें और अभी-अभी स्वाइप की गई फ़ोटो तुरंत वापस आ जाएगी। और चूँकि Swipe2delete Apple की फ़ोटो लाइब्रेरी का उपयोग करता है, डिलीट की गई हर फ़ोटो फ़ोटो ऐप के **हाल ही में डिलीट किया गया** ऐल्बम में जाती है, जहाँ वह स्थायी रूप से हटने से पहले 30 दिनों तक रहती है। फ़ोटो → ऐल्बम → हाल ही में डिलीट किया गया खोलें और उस अवधि में कभी भी फ़ोटो रीस्टोर करें।
  - q: क्या फ़ोटो डिलीट करने से मेरे iPhone का स्टोरेज खाली होता है?
    a: >-
      हाँ। फ़ोटो और स्क्रीनशॉट आमतौर पर iPhone को भरने वाली सबसे बड़ी चीज़ों में से हैं। हर महीना साफ़ करने के बाद, Swipe2delete ठीक-ठीक दिखाता है कि आपने कितनी जगह बचाई। जगह तुरंत वापस पाने के लिए, फ़ोटो ऐप में [हाल ही में डिलीट किया गया ऐल्बम भी खाली करें](/hi/guides/empty-recently-deleted){:target="_self"}। वरना iOS 30 दिनों के बाद उसे अपने आप खाली कर देता है।
  - q: मैंने फ़ोटो डिलीट कर दीं, फिर भी जगह खाली नहीं हुई। ऐसा क्यों?
    a: >-
      आपकी फ़ोटो डिलीट हो चुकी हैं, लेकिन iOS उन्हें आपके लिए सँभालकर रखे हुए है। iPhone पर जब भी आप फ़ोटो डिलीट करते हैं, चाहे Swipe2delete से या किसी और ऐप से, वे फ़ोटो ऐप के **हाल ही में डिलीट किया गया** ऐल्बम में चली जाती हैं, जहाँ वे सुरक्षा के तौर पर 30 दिनों तक रहती हैं। जब तक वह ऐल्बम खाली नहीं होता, स्टोरेज खाली नहीं होता: या तो 30 दिनों बाद अपने आप, या अभी मैन्युअली। हमारी एक मिनट की गाइड देखें: [हाल ही में डिलीट किया गया खाली करके तुरंत जगह कैसे बनाएँ](/hi/guides/empty-recently-deleted){:target="_self"}।
  - q: क्या फ़ोटो iCloud से भी डिलीट हो जाएँगी?
    a: >-
      अगर आप iCloud फ़ोटो इस्तेमाल करते हैं, तो आपकी लाइब्रेरी सिंक रहती है, इसलिए Swipe2delete से डिलीट की गई फ़ोटो (हाल ही में डिलीट किया गया की अवधि के बाद) iCloud और आपके दूसरे डिवाइस से भी हट जाती है। यानी कैमरा रोल की सफ़ाई से iCloud स्टोरेज भी खाली होता है, जिससे आप बड़े iCloud प्लान पर पैसे ख़र्च करने से बच सकते हैं।
  - q: क्या मेरी फ़ोटो निजी रहती हैं? क्या Swipe2delete उन्हें कहीं अपलोड करता है?
    a: >-
      आपकी फ़ोटो कभी आपके डिवाइस से बाहर नहीं जातीं। Swipe2delete सीधे आपके iPhone की फ़ोटो लाइब्रेरी के साथ काम करता है। न कोई अकाउंट है, न ही आपकी फ़ोटो किसी के सर्वर पर अपलोड होती हैं। विवरण के लिए हमारी [प्राइवेसी पॉलिसी](/privacy-policy){:target="_self"} देखें।
  - q: बहुत बड़े कैमरा रोल को साफ़ करने का सबसे तेज़ तरीक़ा क्या है?
    a: >-
      सब कुछ एक साथ करने की कोशिश मत कीजिए। सफ़ाई अधूरी इसी वजह से छूट जाती है। Swipe2delete आपकी लाइब्रेरी को महीनों में बाँट देता है, इसलिए जब भी एक ख़ाली मिनट मिले, आप एक महीना निपटा सकते हैं। आपकी प्रगति हर महीने के हिसाब से सेव होती है, प्रगति व्हील दिखाता है कि आप कितनी दूर आ चुके हैं, और **उस दिन** फ़ीचर पिछले सालों की फ़ोटो वापस लाता है ताकि पुराना ढेर भी साफ़ हो जाए।
  - q: यह फ़ोटो ऐप में फ़ोटो डिलीट करने से कैसे अलग है?
    a: >-
      फ़ोटो ऐप में आपको हर फ़ोटो पर टैप करके चुनना पड़ता है, ग़लत फ़ोटो पर उँगली लगना आसान है और समीक्षा का कोई क़दम नहीं होता। Swipe2delete सिर्फ़ एक काम के लिए बना है: रखना है या डिलीट करना है, यह तेज़ी से तय करना। हर फ़ोटो पर एक स्वाइप, एक अनडू बटन, कुछ भी हटने से पहले अंतिम समीक्षा, और प्रगति ट्रैकिंग ताकि आप काम पूरा कर सकें। लोग इससे 2.7 करोड़ से ज़्यादा फ़ोटो डिलीट कर चुके हैं।
