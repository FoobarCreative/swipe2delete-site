title: よくある質問
description: "Swipe2deleteに関するよくある質問への回答です。スワイプで写真を削除する仕組み、削除した写真の復元、iPhoneとiCloudの空き容量の増やし方、プライバシー、料金について。"
outro: ほかに質問がありますか？[お問い合わせ](/contact){:target="_self"}いただければ、喜んでお手伝いします。
items:
  - q: Swipe2deleteはどう使うのですか？
    a: >-
      Swipe2deleteは、カメラロールを1枚ずつ、1か月ずつ表示します。左にスワイプで写真を削除、右にスワイプで残します。ひと区切りつくと、削除対象に選んだ写真を最終確認してから実際に削除されます。何千枚もの写真整理があっという間に終わり、正直、ちょっと楽しいくらいです。
  - q: Swipe2deleteは無料ですか？
    a: >-
      Swipe2deleteは無料でダウンロードしてお試しいただけます。プレミアムで無制限の整理ができるようになり、サブスクリプションか一度きりの買い切り（ライフタイム購入）を選べます。カメラロールをきれいに保つために、継続課金に縛られる必要はありません。
  - q: うっかり削除した写真は復元できますか？
    a: >-
      はい、二重に守られています。アプリ内では、取り消しをタップすればスワイプしたばかりの写真がすぐ戻ります。さらにSwipe2deleteはAppleの写真ライブラリを使っているため、削除した写真は写真アプリの**「最近削除した項目」**アルバムに移動し、完全に削除されるまで最大30日間保管されます。写真 → アルバム → 最近削除した項目 から、その期間内ならいつでも復元できます。
  - q: 写真を削除するとiPhoneの空き容量は増えますか？
    a: >-
      はい。写真とスクリーンショットは、iPhoneの容量を圧迫する大きな原因のひとつです。1か月分を整理するたびに、Swipe2deleteが節約できた容量を正確に表示します。すぐに容量を確保したい場合は、写真アプリの[「最近削除した項目」を空にしてください](/guides/empty-recently-deleted){:target="_self"}。そのままでも、30日後にはiOSが自動的に解放します。
  - q: 写真を削除したのに空き容量が増えません。なぜですか？
    a: >-
      写真は削除されていますが、iOSがまだ保管してくれている状態です。iPhoneで写真を削除すると、Swipe2deleteでも他のどのアプリでも、写真アプリの**「最近削除した項目」**アルバムに移動し、安全のため最大30日間そこに残ります。このアルバムを空にするまで容量は解放されません。30日後に自動で空になるのを待つか、今すぐ手動で空にしましょう。1分でできる手順はこちら：[「最近削除した項目」を空にしてすぐに容量を増やす方法](/guides/empty-recently-deleted){:target="_self"}。
  - q: iCloudからも写真は削除されますか？
    a: >-
      iCloud写真を使っている場合、ライブラリは同期されているため、Swipe2deleteで削除した写真は（「最近削除した項目」の期間が過ぎた後）iCloudと他のデバイスからも削除されます。つまりカメラロールの整理はiCloudの空き容量づくりにもなり、大きなプランへの課金を避けられるかもしれません。
  - q: 写真のプライバシーは守られますか？どこかにアップロードされませんか？
    a: >-
      写真がデバイスの外に出ることはありません。Swipe2deleteはiPhone上の写真ライブラリと直接やり取りします。アカウント登録はなく、写真をサーバーにアップロードすることも一切ありません。詳しくは[プライバシーポリシー](/privacy-policy){:target="_self"}をご覧ください。
  - q: 大量にたまったカメラロールを最速で片付けるには？
    a: >-
      一気に全部やろうとしないでください。それが挫折のもとです。Swipe2deleteはライブラリを月ごとに分けるので、すきま時間に1か月分ずつ片付けられます。進み具合は月ごとに保存され、進捗ホイールでどこまで進んだかがわかります。さらに**「この日の思い出」**機能が過去の同じ日の写真を呼び出すので、古い写真の整理も進みます。
  - q: 写真アプリで削除するのと何が違いますか？
    a: >-
      写真アプリでは1枚ずつタップして選ぶ必要があり、押し間違いも起きやすく、最終確認もありません。Swipe2deleteは「残すか消すかを素早く決める」というただひとつの仕事のために作られています。写真1枚につきスワイプ1回、取り消しボタン、削除前の最終確認、そして最後までやり切るための進捗表示。これまでに2,700万枚以上の写真が削除されています。
