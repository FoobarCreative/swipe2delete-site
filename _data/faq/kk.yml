title: Жиі қойылатын сұрақтар
description: "Swipe2delete туралы жиі қойылатын сұрақтарға жауаптар: сырғытып фото жою қалай жұмыс істейді, жойылған фотоларды қалпына келтіру, iPhone мен iCloud жадында орын босату, құпиялылық және бағалар."
outro: Тағы сұрағыңыз бар ма? [Бізге жазыңыз](/contact){:target="_self"}, көмектесуге қуаныштымыз.
items:
  - q: Swipe2delete қалай жұмыс істейді?
    a: >-
      Swipe2delete галереяңызды фотолап, ай-айымен көрсетеді. Фотоны жою үшін
      солға, сақтау үшін оңға сырғытыңыз. Топтаманы аяқтағанда, ештеңе жойылмас
      бұрын жоюға белгілегеніңіздің бәрін соңғы рет тексеріп шығасыз. Осылайша
      мыңдаған фотоны тазалау жылдам, тіпті шынын айтқанда, қызықты іске айналады.
  - q: Байқаусызда жойған фотоларды қалпына келтіре аламын ба?
    a: >-
      Иә, екі жолмен. Қолданба ішінде болдырмау түймесін басып, жаңа ғана сырғытқан
      фотоны бірден қайтарыңыз. Swipe2delete Apple фото кітапханасымен жұмыс
      істейтіндіктен, жойылғанның бәрі Photos қолданбасындағы **Жақында жойылған**
      альбомына түседі де, біржола жойылмас бұрын 30 күнге дейін сонда сақталады.
      Осы мерзім ішінде фотоларды кез келген уақытта қалпына келтіру үшін Photos →
      Альбомдар → Жақында жойылған бөлімін ашыңыз.
  - q: Фотоларды жою iPhone жадында орын босата ма?
    a: >-
      Иә. Фотолар мен скриншоттар әдетте iPhone жадын ең көп толтыратын нәрселердің
      бірі. Бір айды тазалағаннан кейін Swipe2delete қанша орын үнемдегеніңізді дәл
      көрсетеді. Орын бірден босауы үшін Photos қолданбасындағы [Жақында жойылған
      альбомын да босатыңыз](/kk/guides/empty-recently-deleted){:target="_self"}.
      Әйтпесе iOS оны 30 күннен кейін автоматты түрде босатады.
  - q: Фотоларды жойдым, бірақ бос орын әлі жоқ. Неге?
    a: >-
      Фотоларыңыз жойылды, бірақ iOS оларды сіз үшін әлі сақтап тұр. iPhone-да фото
      жойғанда, Swipe2delete-пен бе, басқа қолданбамен бе, олар Photos
      қолданбасындағы **Жақында жойылған** альбомына түсіп, қауіпсіздік торы
      ретінде 30 күнге дейін сонда жатады. Жад тек осы альбом босатылғанда ғана
      босайды: не 30 күннен кейін автоматты түрде, не дәл қазір қолмен. Бір
      минуттық нұсқаулығымызды қараңыз: [Жақында жойылған альбомын босатып, орынды
      бірден қалай босатуға болады](/kk/guides/empty-recently-deleted){:target="_self"}.
  - q: Фотолар iCloud-тан да жойыла ма?
    a: >-
      iCloud Photos қолдансаңыз, кітапханаңыз синхрондалған күйде қалады. Яғни
      Swipe2delete-пен жойған фото (Жақында жойылған мерзімі өткен соң) iCloud-тан
      және басқа құрылғыларыңыздан да жойылады. Демек, галереяны тазалау iCloud
      жадында да орын босатады және үлкенірек iCloud жоспарына ақша төлеуден
      құтқаруы мүмкін.
  - q: Фотоларым құпия ма? Swipe2delete оларды бір жерге жүктей ме?
    a: >-
      Фотоларыңыз құрылғыңыздан ешқашан шықпайды. Swipe2delete тікелей iPhone-дағы
      фото кітапханасымен жұмыс істейді. Аккаунт жоқ, фотоларыңыз ешқандай серверге
      жүктелмейді. Толығырақ [құпиялылық
      саясатымыздан](/privacy-policy){:target="_self"} оқыңыз.
  - q: Үлкен галереяны тазалаудың ең жылдам жолы қандай?
    a: >-
      Бәрін бірден жасауға тырыспаңыз. Тазалау әдетте дәл осылай тасталып қалады.
      Swipe2delete кітапханаңызды айларға бөледі, сондықтан бос минут табылғанда
      бір айды бітіріп тастай аласыз. Прогресіңіз әр ай бойынша сақталады, прогресс
      дөңгелегі қанша жол жүргеніңізді көрсетеді, ал **Осы күні** функциясы өткен
      жылдардағы фотоларды қайта шығарып, ескі ретсіздіктің де реттелуіне
      көмектеседі.
  - q: Swipe2delete тегін бе?
    a: >-
      Swipe2delete-ті тегін жүктеп, байқап көруге болады. Premium шексіз тазалауды
      ашады және жазылым немесе бір реттік өмірлік сатып алу арасынан таңдай
      аласыз. Яғни галереяңызды таза ұстау үшін қайталанатын төлемге ешқашан
      тәуелді болмайсыз.
  - q: Мұның Photos қолданбасында фото жоюдан айырмашылығы неде?
    a: >-
      Photos қолданбасында әр фотоны жеке-жеке таңдау керек, қате фотоны басып қалу
      оңай және тексеру қадамы жоқ. Swipe2delete нақ бір іске арналған: сақтау
      немесе жою шешімін жылдам қабылдау. Әр фотоға бір сырғыту, болдырмау түймесі,
      бірдеңе жойылмас бұрын соңғы тексеру және істі шынымен аяқтауыңыз үшін
      прогресті қадағалау. Адамдар онымен 27 миллионнан астам фотоны жойып үлгерді.
