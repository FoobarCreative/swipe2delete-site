title: 자주 묻는 질문
description: "Swipe2delete에 대해 자주 묻는 질문과 답변입니다. 스와이프로 사진을 삭제하는 방법, 삭제한 사진 복구, iPhone과 iCloud 저장 공간 확보, 개인정보 보호, 요금에 대해 알아보세요."
outro: 더 궁금한 점이 있나요? [문의하기](/contact){:target="_self"}로 연락 주시면 기꺼이 도와드리겠습니다.
items:
  - q: Swipe2delete는 어떻게 사용하나요?
    a: >-
      Swipe2delete는 카메라 롤을 한 장씩, 한 달 단위로 보여줍니다. 왼쪽으로 스와이프하면 삭제, 오른쪽으로 스와이프하면 유지됩니다. 한 묶음을 끝내면 삭제하기로 표시한 사진을 최종 확인한 뒤에야 실제로 삭제됩니다. 수천 장의 사진 정리가 금방 끝나고, 솔직히 꽤 재미있기까지 합니다.
  - q: Swipe2delete는 무료인가요?
    a: >-
      Swipe2delete는 무료로 다운로드해서 사용해 볼 수 있습니다. Premium을 이용하면 무제한으로 정리할 수 있고, 구독 또는 한 번만 결제하는 평생 이용권 중에서 선택할 수 있습니다. 카메라 롤을 깨끗하게 유지하기 위해 정기 결제에 묶일 필요가 없습니다.
  - q: 실수로 삭제한 사진을 복구할 수 있나요?
    a: >-
      네, 두 겹으로 보호됩니다. 앱 안에서는 취소를 탭하면 방금 스와이프한 사진이 바로 돌아옵니다. 또한 Swipe2delete는 Apple의 사진 라이브러리를 사용하므로, 삭제된 사진은 사진 앱의 **최근 삭제된 항목** 앨범으로 이동해 완전히 삭제되기 전까지 최대 30일간 보관됩니다. 사진 → 앨범 → 최근 삭제된 항목에서 그 기간 안에 언제든지 복구할 수 있습니다.
  - q: 사진을 삭제하면 iPhone 저장 공간이 늘어나나요?
    a: >-
      네. 사진과 스크린샷은 보통 iPhone 용량을 가장 많이 차지하는 것 중 하나입니다. 한 달 분량을 정리할 때마다 Swipe2delete가 절약한 공간을 정확히 보여줍니다. 공간을 바로 확보하려면 사진 앱에서 [최근 삭제된 항목 앨범을 비우세요](/ko/guides/empty-recently-deleted){:target="_self"}. 그렇지 않아도 30일 후에는 iOS가 자동으로 공간을 확보합니다.
  - q: 사진을 삭제했는데 저장 공간이 그대로입니다. 왜 그런가요?
    a: >-
      사진은 삭제되었지만, iOS가 아직 보관 중인 상태입니다. iPhone에서 사진을 삭제하면 Swipe2delete든 다른 어떤 앱이든, 사진은 사진 앱의 **최근 삭제된 항목** 앨범으로 이동해 안전장치로 최대 30일간 남아 있습니다. 이 앨범을 비우기 전까지는 공간이 확보되지 않습니다. 30일 후 자동으로 비워지길 기다리거나 지금 바로 직접 비울 수 있습니다. 1분이면 충분한 가이드를 확인해 보세요. [최근 삭제된 항목을 비우고 바로 공간을 확보하는 방법](/ko/guides/empty-recently-deleted){:target="_self"}.
  - q: iCloud에서도 사진이 삭제되나요?
    a: >-
      iCloud 사진을 사용 중이라면 라이브러리가 동기화되므로, Swipe2delete로 삭제한 사진은 (최근 삭제된 항목 보관 기간이 지난 후) iCloud와 다른 기기에서도 삭제됩니다. 즉 카메라 롤을 정리하면 iCloud 저장 공간도 함께 확보되어, 더 큰 iCloud 요금제에 돈을 쓰지 않아도 될 수 있습니다.
  - q: 제 사진의 프라이버시는 안전한가요? 어딘가에 업로드되나요?
    a: >-
      사진이 기기 밖으로 나가는 일은 없습니다. Swipe2delete는 iPhone의 사진 라이브러리와 직접 작동합니다. 계정도 없고, 사진을 어떤 서버에도 업로드하지 않습니다. 자세한 내용은 [개인정보 처리방침](/privacy-policy){:target="_self"}을 확인하세요.
  - q: 잔뜩 쌓인 카메라 롤을 가장 빨리 정리하는 방법은 무엇인가요?
    a: >-
      한 번에 다 하려고 하지 마세요. 그러다 중간에 포기하게 됩니다. Swipe2delete는 라이브러리를 월 단위로 나누므로, 잠깐 시간이 날 때마다 한 달씩 끝낼 수 있습니다. 진행 상황은 월별로 저장되고, 진행 휠로 얼마나 왔는지 확인할 수 있으며, **그날의 추억** 기능이 지난 몇 년 전 같은 날짜의 사진을 다시 보여줘 오래된 사진 정리도 함께 진행됩니다.
  - q: 사진 앱에서 삭제하는 것과 무엇이 다른가요?
    a: >-
      사진 앱에서는 사진마다 일일이 탭해서 선택해야 하고, 잘못 누르기 쉬운 데다 최종 확인 단계도 없습니다. Swipe2delete는 '남길지 삭제할지 빠르게 결정한다'는 단 하나의 일을 위해 만들어졌습니다. 사진 한 장에 스와이프 한 번, 취소 버튼, 삭제 전 최종 확인, 그리고 끝까지 해낼 수 있게 돕는 진행 상황 표시까지. 지금까지 2,700만 장이 넘는 사진이 이 앱으로 삭제되었습니다.
