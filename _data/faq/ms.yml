title: Soalan Lazim
description: "Jawapan kepada soalan lazim tentang Swipe2delete: cara leret untuk memadam foto berfungsi, memulihkan foto yang dipadam, membebaskan storan iPhone dan iCloud, privasi, dan harga."
outro: Masih ada soalan? [Hubungi kami](/contact){:target="_self"} dan kami sedia membantu anda.
items:
  - q: Bagaimanakah Swipe2delete berfungsi?
    a: >-
      Swipe2delete memaparkan galeri foto anda satu foto demi satu foto, sebulan demi sebulan. Leret ke kiri untuk memadam foto, leret ke kanan untuk menyimpannya. Apabila anda menamatkan satu sesi, anda akan membuat semakan terakhir ke atas semua foto yang ditanda untuk dipadam sebelum apa-apa benar-benar dibuang. Mengemas beribu-ribu foto jadi pantas dan, sejujurnya, agak menyeronokkan.
  - q: Adakah Swipe2delete percuma?
    a: >-
      Swipe2delete percuma untuk dimuat turun dan dicuba. Premium membuka pembersihan tanpa had, dan anda boleh memilih antara langganan atau belian sepanjang hayat dengan sekali bayaran sahaja, jadi anda tidak akan terikat dengan bayaran berulang semata-mata untuk memastikan galeri foto anda kemas.
  - q: Bolehkah saya memulihkan foto yang terpadam secara tidak sengaja?
    a: >-
      Boleh, malah dengan dua lapisan perlindungan. Dalam aplikasi, ketik buat asal untuk terus mengembalikan foto yang baru anda leret. Dan kerana Swipe2delete menggunakan pustaka foto Apple, semua yang dipadam akan masuk ke album **Baru Dipadam** dalam aplikasi Foto, dan kekal di situ sehingga 30 hari sebelum dipadam secara kekal. Buka Foto → Album → Baru Dipadam untuk memulihkan foto pada bila-bila masa dalam tempoh itu.
  - q: Adakah memadam foto membebaskan storan pada iPhone saya?
    a: >-
      Ya. Foto dan tangkapan skrin biasanya antara perkara yang paling banyak memenuhi iPhone. Selepas anda mengemas satu bulan, Swipe2delete menunjukkan dengan tepat berapa banyak ruang yang anda jimatkan. Untuk mendapatkan semula ruang serta-merta, [kosongkan juga album Baru Dipadam](/guides/empty-recently-deleted){:target="_self"} dalam aplikasi Foto. Jika tidak, iOS akan membebaskannya secara automatik selepas 30 hari.
  - q: Saya sudah memadam foto tetapi ruang kosong masih tidak bertambah. Kenapa?
    a: >-
      Foto anda sudah dipadam, tetapi iOS masih menyimpannya untuk anda. Setiap kali anda memadam foto pada iPhone, sama ada dengan Swipe2delete atau mana-mana aplikasi lain, foto akan masuk ke album **Baru Dipadam** dalam aplikasi Foto dan kekal di situ sehingga 30 hari sebagai langkah keselamatan. Storan tidak akan dibebaskan sehingga album itu dikosongkan, sama ada secara automatik selepas 30 hari atau secara manual sekarang juga. Lihat panduan satu minit kami: [cara mengosongkan Baru Dipadam dan membebaskan ruang serta-merta](/guides/empty-recently-deleted){:target="_self"}.
  - q: Adakah foto turut dipadam daripada iCloud?
    a: >-
      Jika anda menggunakan Foto iCloud, pustaka anda sentiasa disegerakkan, jadi foto yang anda padam dengan Swipe2delete turut dibuang daripada iCloud dan peranti anda yang lain (selepas tempoh Baru Dipadam tamat). Ini bermakna mengemas galeri foto turut membebaskan storan iCloud, dan mungkin menyelamatkan anda daripada membayar pelan iCloud yang lebih besar.
  - q: Adakah foto saya kekal peribadi? Adakah Swipe2delete memuat naiknya ke mana-mana?
    a: >-
      Foto anda tidak pernah meninggalkan peranti anda. Swipe2delete berfungsi terus dengan pustaka foto pada iPhone anda. Tiada akaun, dan foto anda tidak pernah dimuat naik ke pelayan sesiapa pun. Lihat [dasar privasi](/privacy-policy){:target="_self"} kami untuk butiran lanjut.
  - q: Apakah cara terpantas untuk mengemas galeri foto yang sudah bertimbun?
    a: >-
      Jangan cuba menyiapkan semuanya sekali gus. Itulah punca kerja mengemas selalu terbengkalai. Swipe2delete membahagikan pustaka anda mengikut bulan, jadi anda boleh menyelesaikan satu bulan setiap kali ada masa terluang. Kemajuan anda disimpan mengikut bulan, roda kemajuan menunjukkan sejauh mana anda telah pergi, dan ciri **Pada Hari Ini** membawa kembali foto dari tahun-tahun lalu supaya timbunan lama turut diuruskan.
  - q: Apakah bezanya dengan memadam foto dalam aplikasi Foto?
    a: >-
      Aplikasi Foto memerlukan anda mengetik dan memilih setiap foto, mudah tersilap tekan, dan tiada langkah semakan. Swipe2delete dibina untuk satu tugas sahaja: memutuskan simpan atau padam dengan pantas. Satu leretan bagi setiap foto, butang buat asal, semakan terakhir sebelum apa-apa dipadam, dan penjejakan kemajuan supaya anda benar-benar menyudahkannya. Lebih 27 juta foto telah dipadam dengan aplikasi ini.
