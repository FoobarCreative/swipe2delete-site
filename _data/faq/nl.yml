title: Veelgestelde vragen
description: "Antwoorden op veelgestelde vragen over Swipe2delete: hoe foto's verwijderen door te vegen werkt, verwijderde foto's terughalen, opslagruimte vrijmaken op iPhone en in iCloud, privacy en prijzen."
outro: Nog een vraag? [Neem contact op](/contact){:target="_self"}, we helpen je graag verder.
items:
  - q: Hoe werkt Swipe2delete?
    a: >-
      Swipe2delete laat je filmrol foto voor foto zien, maand voor maand. Veeg naar links
      om een foto te verwijderen en naar rechts om hem te bewaren. Aan het einde van een
      ronde zie je nog één keer alles wat je hebt gemarkeerd om te verwijderen, voordat er
      iets wordt gewist. Zo wordt duizenden foto's opruimen snel gedaan en eerlijk gezegd
      zelfs leuk.
  - q: Kan ik per ongeluk verwijderde foto's terughalen?
    a: >-
      Ja, zelfs op twee manieren. In de app tik je op ongedaan maken om een zojuist
      weggeveegde foto direct terug te halen. En omdat Swipe2delete met de fotobibliotheek
      van Apple werkt, komt alles wat je verwijdert in het album **Recent verwijderd** van
      de Foto's-app terecht, waar het tot 30 dagen blijft staan voordat het definitief
      wordt gewist. Open Foto's → Albums → Recent verwijderd om foto's binnen die periode
      terug te zetten.
  - q: Maakt foto's verwijderen opslagruimte vrij op mijn iPhone?
    a: >-
      Ja. Foto's en schermafbeeldingen horen meestal bij de grootste ruimtevreters op een
      iPhone. Na elke opgeruimde maand laat Swipe2delete precies zien hoeveel ruimte je
      hebt bespaard. Wil je de ruimte meteen terug, leeg dan ook het album
      [Recent verwijderd](/nl/guides/empty-recently-deleted){:target="_self"} in de
      Foto's-app. Anders maakt iOS de ruimte na 30 dagen automatisch vrij.
  - q: Ik heb foto's verwijderd, maar er is nog steeds geen vrije ruimte. Hoe kan dat?
    a: >-
      Je foto's zijn verwijderd, maar iOS bewaart ze nog even voor je. Wanneer je op een
      iPhone foto's verwijdert, met Swipe2delete of een andere app, gaan ze naar het album
      **Recent verwijderd** in de Foto's-app, waar ze tot 30 dagen als vangnet blijven
      staan. De opslagruimte komt pas vrij zodra dat album wordt geleegd, automatisch na
      30 dagen of meteen handmatig. Bekijk onze gids van één minuut: [zo leeg je Recent
      verwijderd en maak je direct ruimte vrij](/nl/guides/empty-recently-deleted){:target="_self"}.
  - q: Worden foto's ook uit iCloud verwijderd?
    a: >-
      Als je iCloud-foto's gebruikt, blijft je bibliotheek gesynchroniseerd. Een foto die
      je met Swipe2delete verwijdert, verdwijnt dus ook uit iCloud en van je andere
      apparaten (na de periode in Recent verwijderd). Je filmrol opruimen maakt zo ook
      iCloud-opslag vrij en kan je een groter iCloud-abonnement besparen.
  - q: Zijn mijn foto's privé? Uploadt Swipe2delete ze ergens naartoe?
    a: >-
      Je foto's verlaten je apparaat nooit. Swipe2delete werkt rechtstreeks met de
      fotobibliotheek op je iPhone. Er is geen account en je foto's worden nooit naar een
      server geüpload. Lees ons [privacybeleid](/privacy-policy){:target="_self"} voor de
      details.
  - q: Wat is de snelste manier om een enorme filmrol op te ruimen?
    a: >-
      Probeer niet alles in één keer te doen. Zo stranden de meeste opruimacties.
      Swipe2delete verdeelt je bibliotheek in maanden, zodat je een maand kunt wegwerken
      wanneer je even tijd hebt. Je voortgang wordt per maand bewaard, een voortgangswiel
      laat zien hoe ver je bent, en de functie **Op deze dag** haalt foto's van voorgaande
      jaren naar boven, zodat ook oude rommel aan de beurt komt.
  - q: Is Swipe2delete gratis?
    a: >-
      Swipe2delete kun je gratis downloaden en uitproberen. Premium ontgrendelt onbeperkt
      opruimen, met de keuze tussen een abonnement of een eenmalige lifetime-aankoop. Je
      zit dus nooit vast aan een doorlopend abonnement om je filmrol schoon te houden.
  - q: Wat is het verschil met verwijderen in de Foto's-app?
    a: >-
      In de Foto's-app moet je elke foto apart aantikken, tik je snel op de verkeerde en
      is er geen laatste controle. Swipe2delete is gebouwd voor precies één taak, namelijk
      snel beslissen of je een foto bewaart of verwijdert. Eén veeg per foto, een knop om
      ongedaan te maken, een laatste controle voordat er iets wordt verwijderd, en
      voortgang bijhouden zodat je het echt afmaakt. Er zijn al meer dan 27 miljoen foto's
      mee verwijderd.
