title: Często zadawane pytania
description: "Odpowiedzi na częste pytania o Swipe2delete: jak działa usuwanie zdjęć przesunięciem, odzyskiwanie usuniętych zdjęć, zwalnianie miejsca na iPhonie i w iCloud, prywatność i ceny."
outro: Masz jeszcze pytanie? [Napisz do nas](/contact){:target="_self"}, chętnie pomożemy.
items:
  - q: Jak działa Swipe2delete?
    a: >-
      Swipe2delete pokazuje rolkę aparatu zdjęcie po zdjęciu, miesiąc po miesiącu. Przesuń
      w lewo, aby usunąć zdjęcie, i w prawo, aby je zachować. Po zakończeniu partii
      zobaczysz ostateczny przegląd wszystkiego, co oznaczono do usunięcia, zanim
      cokolwiek zniknie. Dzięki temu porządkowanie tysięcy zdjęć staje się szybkie i,
      szczerze mówiąc, całkiem przyjemne.
  - q: Czy Swipe2delete jest darmowe?
    a: >-
      Swipe2delete można pobrać i wypróbować za darmo. Premium odblokowuje nieograniczone
      porządkowanie, do wyboru w formie subskrypcji lub jednorazowego zakupu dożywotniego.
      Nie musisz więc wiązać się stałą opłatą, aby utrzymać porządek w rolce aparatu.
  - q: Czy mogę odzyskać zdjęcia usunięte przez przypadek?
    a: >-
      Tak, i to na dwa sposoby. W aplikacji stuknij cofnij, aby natychmiast przywrócić
      właśnie odrzucone zdjęcie. A ponieważ Swipe2delete korzysta z biblioteki zdjęć
      Apple, wszystko, co usuniesz, trafia do albumu **Ostatnio usunięte** w aplikacji
      Zdjęcia, gdzie pozostaje do 30 dni przed trwałym usunięciem. Otwórz Zdjęcia → Albumy
      → Ostatnio usunięte, aby w tym czasie przywrócić zdjęcia w dowolnym momencie.
  - q: Czy usuwanie zdjęć zwalnia miejsce na moim iPhonie?
    a: >-
      Tak. Zdjęcia i zrzuty ekranu to zwykle jedne z największych pożeraczy miejsca na
      iPhonie. Po uporządkowaniu każdego miesiąca Swipe2delete pokazuje dokładnie, ile
      miejsca udało się zaoszczędzić. Aby miejsce zwolniło się od razu, [opróżnij też
      album Ostatnio usunięte](/guides/empty-recently-deleted){:target="_self"} w
      aplikacji Zdjęcia. W przeciwnym razie iOS zwolni je automatycznie po 30 dniach.
  - q: Zdjęcia zostały usunięte, ale wolnego miejsca nadal brak. Dlaczego?
    a: >-
      Twoje zdjęcia są usunięte, ale iOS wciąż je dla Ciebie przechowuje. Gdy usuwasz
      zdjęcia na iPhonie, czy to w Swipe2delete, czy w innej aplikacji, trafiają one do
      albumu **Ostatnio usunięte** w aplikacji Zdjęcia, gdzie czekają do 30 dni jako
      zabezpieczenie. Miejsce zwalnia się dopiero po opróżnieniu tego albumu,
      automatycznie po 30 dniach albo ręcznie od razu. Zobacz nasz minutowy poradnik: [jak
      opróżnić album Ostatnio usunięte i natychmiast zwolnić
      miejsce](/guides/empty-recently-deleted){:target="_self"}.
  - q: Czy zdjęcia zostaną usunięte także z iCloud?
    a: >-
      Jeśli korzystasz ze Zdjęć iCloud, Twoja biblioteka pozostaje zsynchronizowana, więc
      zdjęcie usunięte w Swipe2delete zniknie też z iCloud i pozostałych urządzeń (po
      upływie okresu w albumie Ostatnio usunięte). Porządkowanie rolki aparatu zwalnia
      więc również miejsce w iCloud i może uchronić Cię przed opłacaniem większego planu
      iCloud.
  - q: Czy moje zdjęcia są prywatne? Czy Swipe2delete gdzieś je wysyła?
    a: >-
      Twoje zdjęcia nigdy nie opuszczają urządzenia. Swipe2delete działa bezpośrednio na
      bibliotece zdjęć w Twoim iPhonie. Nie ma konta ani wysyłania zdjęć na żaden serwer.
      Szczegóły znajdziesz w naszej [polityce
      prywatności](/privacy-policy){:target="_self"}.
  - q: Jak najszybciej uporządkować ogromną rolkę aparatu?
    a: >-
      Nie próbuj zrobić wszystkiego naraz. Właśnie tak porządki kończą się porażką.
      Swipe2delete dzieli bibliotekę na miesiące, więc możesz odhaczyć jeden miesiąc, gdy
      tylko masz wolną chwilę. Postęp zapisuje się dla każdego miesiąca, koło postępu
      pokazuje, ile już za Tobą, a funkcja **W tym dniu** przywołuje zdjęcia z minionych
      lat, dzięki czemu porządek obejmie też stare zaległości.
  - q: Czym to się różni od usuwania zdjęć w aplikacji Zdjęcia?
    a: >-
      W aplikacji Zdjęcia trzeba zaznaczać każde zdjęcie osobno, łatwo stuknąć nie to, co
      trzeba, i nie ma etapu ostatecznego przeglądu. Swipe2delete powstało do dokładnie
      jednego zadania, czyli szybkiego decydowania, zachować czy usunąć. Jedno
      przesunięcie na zdjęcie, przycisk cofania, ostateczny przegląd przed usunięciem
      czegokolwiek i śledzenie postępu, dzięki któremu naprawdę dobrniesz do końca. W ten
      sposób usunięto już ponad 27 milionów zdjęć.
