title: Часто задаваемые вопросы
description: "Ответы на частые вопросы о Swipe2delete: как работает удаление фото свайпом, как восстановить удаленные фото, как освободить место на iPhone и в iCloud, конфиденциальность и цены."
outro: Остался вопрос? [Напишите нам](/contact){:target="_self"}, мы с радостью поможем.
items:
  - q: Как работает Swipe2delete?
    a: >-
      Swipe2delete показывает фотопленку по одному фото за раз, месяц за месяцем.
      Свайпните влево, чтобы удалить фото, и вправо, чтобы оставить. Когда партия
      закончена, вы получаете финальную проверку всего, что отметили на удаление,
      прежде чем что-то будет удалено. Так уборка тысяч фото становится быстрой и,
      честно говоря, даже увлекательной.
  - q: Swipe2delete бесплатный?
    a: >-
      Swipe2delete можно бесплатно скачать и попробовать. Premium открывает
      безлимитную уборку, причем на выбор: подписка или разовая пожизненная покупка.
      Вам не придется оформлять постоянную подписку, чтобы держать фотопленку в
      чистоте.
  - q: Могу ли я восстановить случайно удаленные фото?
    a: >-
      Да, причем двумя способами. В самом приложении нажмите «Отменить», и только что
      смахнутое фото сразу вернется. А поскольку Swipe2delete работает с
      фотомедиатекой Apple, все удаленное попадает в альбом **Недавно удаленные** в
      приложении «Фото», где хранится до 30 дней перед окончательным удалением.
      Откройте «Фото» → «Альбомы» → «Недавно удаленные», чтобы восстановить фото в
      течение этого срока.
  - q: Освобождает ли удаление фото место на iPhone?
    a: >-
      Да. Фото и скриншоты обычно занимают больше всего места на iPhone. После каждого
      разобранного месяца Swipe2delete показывает, сколько именно места вы сэкономили.
      Чтобы место освободилось сразу, дополнительно [очистите альбом «Недавно
      удаленные»](/guides/empty-recently-deleted){:target="_self"} в приложении
      «Фото». Иначе iOS освободит его автоматически через 30 дней.
  - q: Я удалил фото, но свободного места все равно нет. Почему?
    a: >-
      Ваши фото удалены, но iOS пока хранит их для вас. Когда вы удаляете фото на
      iPhone, через Swipe2delete или любое другое приложение, они попадают в альбом
      **Недавно удаленные** в приложении «Фото» и остаются там до 30 дней в качестве
      подстраховки. Место освободится только после очистки этого альбома:
      автоматически через 30 дней или вручную прямо сейчас. Вот наша инструкция на
      одну минуту: [как очистить «Недавно удаленные» и сразу освободить
      место](/guides/empty-recently-deleted){:target="_self"}.
  - q: Фото удалятся и из iCloud?
    a: >-
      Если вы используете Фото iCloud, медиатека остается синхронизированной, поэтому
      фото, удаленное через Swipe2delete, исчезнет также из iCloud и с других ваших
      устройств (после истечения срока «Недавно удаленных»). Значит, уборка фотопленки
      освобождает и место в iCloud, а это может избавить вас от оплаты более дорогого
      тарифа iCloud.
  - q: Мои фото приватны? Загружает ли их Swipe2delete куда-либо?
    a: >-
      Ваши фото никогда не покидают устройство. Swipe2delete работает напрямую с
      фотомедиатекой на вашем iPhone. Здесь нет учетной записи и нет загрузки ваших
      фото на чьи-либо серверы. Подробности в нашей [политике
      конфиденциальности](/privacy-policy){:target="_self"}.
  - q: Как быстрее всего разобрать огромную фотопленку?
    a: >-
      Не пытайтесь сделать все за один раз. Именно так уборки и забрасываются.
      Swipe2delete делит медиатеку на месяцы, чтобы вы могли разобрать один месяц в
      любую свободную минуту. Прогресс сохраняется по каждому месяцу, колесо прогресса
      показывает, сколько уже сделано, а функция **В этот день** возвращает фото
      прошлых лет, чтобы старый хлам тоже не остался без внимания.
  - q: Чем это отличается от удаления фото в приложении «Фото»?
    a: >-
      В приложении «Фото» приходится выделять каждое фото по отдельности, легко нажать
      не туда, и нет финальной проверки. Swipe2delete создан ровно для одной задачи:
      быстро решать, оставить или удалить. Один свайп на фото, кнопка отмены,
      финальная проверка перед удалением и отслеживание прогресса, чтобы вы
      действительно дошли до конца. С его помощью уже удалено более 27 миллионов фото.
