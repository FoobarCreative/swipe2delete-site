title: Часті запитання
description: "Відповіді на поширені запитання про Swipe2delete: як працює видалення фото свайпом, як відновити видалені фото, як звільнити місце на iPhone та в iCloud, конфіденційність і ціни."
outro: Залишилося запитання? [Напишіть нам](/contact){:target="_self"}, і ми залюбки допоможемо.
items:
  - q: Як працює Swipe2delete?
    a: >-
      Swipe2delete показує фотоплівку по одному фото за раз, місяць за місяцем.
      Свайпніть вліво, щоб видалити фото, і вправо, щоб залишити. Коли партію
      завершено, ви отримуєте фінальну перевірку всього, що позначили на видалення,
      перш ніж щось буде видалено. Так розбір тисяч фото стає швидким і, чесно кажучи,
      навіть захопливим.
  - q: Swipe2delete безкоштовний?
    a: >-
      Swipe2delete можна безкоштовно завантажити та спробувати. Premium відкриває
      безлімітне прибирання, і ви самі обираєте: підписка або разова довічна покупка.
      Тож вам не доведеться оформлювати постійну підписку, щоб тримати фотоплівку в
      чистоті.
  - q: Чи можу я відновити випадково видалені фото?
    a: >-
      Так, і навіть двома способами. У самому застосунку натисніть «Скасувати», і
      щойно змахнуте фото одразу повернеться. А оскільки Swipe2delete працює з
      фотомедіатекою Apple, усе видалене потрапляє до альбому **Нещодавно видалені** у
      застосунку «Фото», де зберігається до 30 днів перед остаточним видаленням.
      Відкрийте «Фото» → «Альбоми» → «Нещодавно видалені», щоб відновити фото протягом
      цього часу.
  - q: Чи звільняє видалення фото місце на iPhone?
    a: >-
      Так. Фото та скриншоти зазвичай займають найбільше місця на iPhone. Після
      кожного розібраного місяця Swipe2delete показує, скільки саме місця ви
      заощадили. Щоб місце звільнилося одразу, додатково [очистіть альбом «Нещодавно
      видалені»](/guides/empty-recently-deleted){:target="_self"} у застосунку «Фото».
      Інакше iOS звільнить його автоматично через 30 днів.
  - q: Я видалив фото, але вільного місця досі немає. Чому?
    a: >-
      Ваші фото видалені, але iOS поки що зберігає їх для вас. Коли ви видаляєте фото
      на iPhone, через Swipe2delete чи будь-який інший застосунок, вони потрапляють до
      альбому **Нещодавно видалені** у застосунку «Фото» і залишаються там до 30 днів
      як підстраховка. Місце звільниться лише після очищення цього альбому:
      автоматично через 30 днів або вручну просто зараз. Ось наша інструкція на одну
      хвилину: [як очистити «Нещодавно видалені» і одразу звільнити
      місце](/guides/empty-recently-deleted){:target="_self"}.
  - q: Чи видаляться фото також з iCloud?
    a: >-
      Якщо ви користуєтеся Фото iCloud, медіатека залишається синхронізованою, тож
      фото, видалене через Swipe2delete, зникне також з iCloud і з інших ваших
      пристроїв (після завершення періоду «Нещодавно видалених»). Отже, прибирання
      фотоплівки звільняє й місце в iCloud, а це може позбавити вас потреби платити за
      більший тариф iCloud.
  - q: Чи приватні мої фото? Чи завантажує їх Swipe2delete кудись?
    a: >-
      Ваші фото ніколи не покидають пристрій. Swipe2delete працює безпосередньо з
      фотомедіатекою на вашому iPhone. Тут немає облікового запису і жодного
      завантаження ваших фото на чиїсь сервери. Деталі в нашій [політиці
      конфіденційності](/privacy-policy){:target="_self"}.
  - q: Як найшвидше розібрати величезну фотоплівку?
    a: >-
      Не намагайтеся зробити все за один раз. Саме так прибирання і закидають.
      Swipe2delete ділить медіатеку на місяці, тож ви можете розібрати один місяць у
      будь-яку вільну хвилину. Прогрес зберігається для кожного місяця, колесо
      прогресу показує, скільки вже зроблено, а функція **Цього дня** повертає фото
      минулих років, щоб і старий мотлох не залишився поза увагою.
  - q: Чим це відрізняється від видалення фото в застосунку «Фото»?
    a: >-
      У застосунку «Фото» доводиться виділяти кожне фото окремо, легко натиснути не
      туди, і немає фінальної перевірки. Swipe2delete створений рівно для одного
      завдання: швидко вирішувати, залишити чи видалити. Один свайп на фото, кнопка
      скасування, фінальна перевірка перед видаленням і відстеження прогресу, щоб ви
      справді дійшли до кінця. З його допомогою вже видалено понад 27 мільйонів фото.
