title: 常见问题
description: "关于Swipe2delete的常见问题解答：滑动删除照片的原理、找回已删除的照片、释放iPhone和iCloud存储空间、隐私保护以及价格。"
outro: 还有其他问题？[联系我们](/contact){:target="_self"}，我们很乐意为你解答。
items:
  - q: Swipe2delete是如何工作的？
    a: >-
      Swipe2delete按月展示你的相册，一次一张照片。向左滑动删除，向右滑动保留。完成一批后，你可以在照片真正被删除前，对所有标记删除的照片做最终确认。它让清理几千张照片这件事变得又快又轻松，说实话，还挺好玩的。
  - q: 不小心删掉的照片能找回来吗？
    a: >-
      可以，而且有双重保障。在应用内，点击撤销即可立刻找回刚刚滑掉的照片。此外，Swipe2delete使用Apple的照片图库，删除的照片都会进入照片App的**最近删除**相册，在那里最多保留30天，之后才会被永久删除。打开照片 → 相册 → 最近删除，在此期间随时可以恢复。
  - q: 删除照片能释放iPhone的存储空间吗？
    a: >-
      能。照片和截屏通常是占用iPhone空间最多的内容之一。每清理完一个月，Swipe2delete都会准确显示你节省了多少空间。想立刻回收空间，还可以在照片App中[清空最近删除相册](/zh-hans/guides/empty-recently-deleted){:target="_self"}。否则iOS会在30天后自动释放。
  - q: 我删除了照片，但空间还是没变多。为什么？
    a: >-
      照片确实删掉了，只是iOS还在替你保管。在iPhone上删除照片时，无论用Swipe2delete还是其他任何应用，照片都会进入照片App的**最近删除**相册，作为安全保障在那里最多保留30天。在清空这个相册之前，空间不会被释放：可以等30天后自动清空，也可以现在手动清空。看看我们的一分钟指南：[如何清空最近删除并立即释放空间](/zh-hans/guides/empty-recently-deleted){:target="_self"}。
  - q: iCloud里的照片也会被删除吗？
    a: >-
      如果你使用iCloud照片，图库会保持同步，所以用Swipe2delete删除的照片（在最近删除保留期结束后）也会从iCloud和你的其他设备上移除。这意味着清理相册的同时也在释放iCloud空间，或许还能帮你省下升级更大iCloud方案的钱。
  - q: 我的照片隐私安全吗？会被上传到别处吗？
    a: >-
      你的照片永远不会离开你的设备。Swipe2delete直接读取iPhone本机的照片图库，无需注册账号，也绝不会把你的照片上传到任何服务器。详情请查看我们的[隐私政策](/privacy-policy){:target="_self"}。
  - q: 清理海量相册最快的方法是什么？
    a: >-
      别想着一口气全部搞定，那正是半途而废的原因。Swipe2delete把图库按月拆分，有空的几分钟就能清完一个月。进度按月保存，进度轮让你随时看到已经完成了多少，**那年今日**功能还会带回往年同一天的照片，连陈年旧照也能顺手清理。
  - q: Swipe2delete是免费的吗？
    a: >-
      Swipe2delete可以免费下载试用。Premium解锁无限清理，你可以选择订阅，也可以选择一次性买断的终身版，不必为了保持相册整洁而被绑在循环扣费上。
  - q: 这和直接在照片App里删照片有什么区别？
    a: >-
      在照片App里，你得一张张点选，很容易点错，而且没有最终确认这一步。Swipe2delete只专注做好一件事：快速决定留还是删。每张照片只需滑动一次，有撤销按钮，删除前有最终确认，还有进度追踪帮你坚持到底。用户已经用它删除了超过2700万张照片。
