title: 常見問題
description: "關於Swipe2delete的常見問題解答：滑動刪除照片的原理、找回已刪除的照片、釋放iPhone和iCloud儲存空間、隱私保護以及價格。"
outro: 還有其他問題？[聯絡我們](/contact){:target="_self"}，我們很樂意為你解答。
items:
  - q: Swipe2delete是如何運作的？
    a: >-
      Swipe2delete按月顯示你的相簿，一次一張照片。向左滑動刪除，向右滑動保留。完成一批後，你可以在照片真正被刪除前，對所有標記刪除的照片做最終確認。它讓整理幾千張照片這件事變得又快又輕鬆，說實話，還挺好玩的。
  - q: 不小心刪掉的照片能找回來嗎？
    a: >-
      可以，而且有雙重保障。在App內，點一下還原即可立刻找回剛剛滑掉的照片。此外，Swipe2delete使用Apple的照片圖庫，刪除的照片都會進入照片App的**最近刪除**相簿，在那裡最多保留30天，之後才會被永久刪除。打開照片 → 相簿 → 最近刪除，在此期間隨時可以復原。
  - q: 刪除照片能釋放iPhone的儲存空間嗎？
    a: >-
      能。照片和截圖通常是佔用iPhone空間最多的內容之一。每整理完一個月，Swipe2delete都會準確顯示你節省了多少空間。想立刻取回空間，還可以在照片App中[清空最近刪除相簿](/zh-hant/guides/empty-recently-deleted){:target="_self"}。否則iOS會在30天後自動釋放。
  - q: 我刪除了照片，但空間還是沒變多。為什麼？
    a: >-
      照片確實刪掉了，只是iOS還在替你保管。在iPhone上刪除照片時，無論用Swipe2delete還是其他任何App，照片都會進入照片App的**最近刪除**相簿，作為安全保障在那裡最多保留30天。在清空這個相簿之前，空間不會被釋放：可以等30天後自動清空，也可以現在手動清空。看看我們的一分鐘指南：[如何清空最近刪除並立即釋放空間](/zh-hant/guides/empty-recently-deleted){:target="_self"}。
  - q: iCloud裡的照片也會被刪除嗎？
    a: >-
      如果你使用iCloud照片，圖庫會保持同步，所以用Swipe2delete刪除的照片（在最近刪除保留期結束後）也會從iCloud和你的其他裝置上移除。這代表整理相簿的同時也在釋放iCloud空間，或許還能幫你省下升級更大iCloud方案的錢。
  - q: 我的照片隱私安全嗎？會被上傳到別處嗎？
    a: >-
      你的照片永遠不會離開你的裝置。Swipe2delete直接讀取iPhone本機的照片圖庫，無需註冊帳號，也絕不會把你的照片上傳到任何伺服器。詳情請參閱我們的[隱私權政策](/privacy-policy){:target="_self"}。
  - q: 整理超大相簿最快的方法是什麼？
    a: >-
      別想著一口氣全部搞定，那正是半途而廢的原因。Swipe2delete把圖庫按月拆分，有空的幾分鐘就能清完一個月。進度按月儲存，進度輪讓你隨時看到已經完成多少，**那年今日**功能還會帶回往年同一天的照片，連陳年舊照也能順手整理。
  - q: Swipe2delete是免費的嗎？
    a: >-
      Swipe2delete可以免費下載試用。Premium解鎖無限清理，你可以選擇訂閱，也可以選擇一次性買斷的終身版，不必為了保持相簿整潔而被綁在循環扣款上。
  - q: 這和直接在照片App裡刪照片有什麼不同？
    a: >-
      在照片App裡，你得一張張點選，很容易點錯，而且沒有最終確認這一步。Swipe2delete只專注做好一件事：快速決定留還是刪。每張照片只需滑動一次，有還原按鈕，刪除前有最終確認，還有進度追蹤幫你堅持到底。使用者已經用它刪除了超過2,700萬張照片。
