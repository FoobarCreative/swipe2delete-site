title: "حذفت صورًا لكن لا توجد مساحة بعد؟ إفراغ ألبوم المحذوفة مؤخرًا على iPhone"
short_title: "إفراغ المحذوفة مؤخرًا"
description: "تستمر الصور المحذوفة في استهلاك مساحة التخزين لمدة 30 يومًا في ألبوم المحذوفة مؤخرًا. إليك كيفية إفراغه وتحرير المساحة على iPhone فورًا."
cta_label: "افتح الصور →"
body: |
  نظّفت مكتبة صورك، لكن شريط التخزين لم يتغير. لا تقلق: صورك محذوفة فعلًا. فقط يحتفظ بها iOS لمدة 30 يومًا قبل تحرير المساحة.

  ## لماذا لم تتحرر المساحة بعد

  عندما تحذف صورًا على iPhone، سواء عبر Swipe2delete أو تطبيق آخر أو تطبيق الصور نفسه، لا يزيلها iOS فورًا. بل ينقلها إلى ألبوم **المحذوفة مؤخرًا**، حيث تبقى **30 يومًا** كشبكة أمان في حال غيّرت رأيك. وحتى يُفرَّغ هذا الألبوم، تستمر الصور في شغل مساحة التخزين.

  **الحل:** أفرغ ألبوم المحذوفة مؤخرًا يدويًا وستستعيد المساحة فورًا.

  ## خطوة بخطوة: إفراغ المحذوفة مؤخرًا

  ### 1. افتح تطبيق الصور

  اضغط على أيقونة **الصور** في الشاشة الرئيسية.

  ![تطبيق الصور في الشاشة الرئيسية](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. انتقل إلى المحذوفة مؤخرًا

  مرر لأسفل حتى قسم **الأدوات المساعدة**، ثم اضغط على **المحذوفة مؤخرًا**. (في إصدارات iOS الأقدم ستجده ضمن الألبومات.)

  ![المحذوفة مؤخرًا ضمن الأدوات المساعدة](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. أفرغ الألبوم

  اضغط على **تحديد** في أعلى الشاشة، ثم اضغط على **حذف الكل** في أسفل الشاشة.

  ![زر تحديد في المحذوفة مؤخرًا](/assets/guides/empty-recently-deleted/select.webp)

  ![زر حذف الكل في المحذوفة مؤخرًا](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. أكّد الحذف

  اضغط على **حذف من جميع الأجهزة** لإزالتها نهائيًا.

  ![نافذة تأكيد حذف الصور](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **تم!** تتحرر المساحة فورًا، على iPhone وفي iCloud إذا كنت تستخدم صور iCloud.

  ## كم من المساحة سأستعيد؟

  يعرض ألبوم المحذوفة مؤخرًا حجمه الإجمالي في الأعلى. وبعد تنظيف جيد لمكتبة صورك غالبًا ما يكون كبيرًا:

  - تنظيف خفيف: 500MB - 2GB
  - تنظيف منتظم: 2GB - 5GB
  - تنظيف كبير: 5GB - 10GB+

  ## معلومات مفيدة

  ⚠️ **لا يمكن التراجع عن إفراغ المحذوفة مؤخرًا.** ألقِ نظرة سريعة على الألبوم قبل حذف الكل. إنها فرصتك الأخيرة لإنقاذ صورة.

  💡 **لست مضطرًا إلى فعل هذا أصلًا.** إذا لم تكن مستعجلًا، يفرغ iOS الألبوم تلقائيًا، بعد 30 يومًا من حذف كل صورة. الإفراغ اليدوي يمنحك المساحة الآن فقط.

  💡 **اجعلها عادة.** بعد كل جلسة تنظيف، أفرغ المحذوفة مؤخرًا مرة واحدة. عندها فقط تعود المساحة فعلًا.
