title: "Изтрихте снимки, а мястото не се освобождава? Изпразнете Наскоро изтрити на iPhone"
short_title: "Изпразнете Наскоро изтрити"
description: "Изтритите снимки продължават да заемат място 30 дни в албума Наскоро изтрити. Ето как да го изпразните и да освободите място на вашия iPhone веднага."
cta_label: "Отворете Снимки →"
body: |
  Разчистихте галерията си, но лентата на хранилището не помръдна. Не се притеснявайте: снимките ви наистина са изтрити. iOS просто ги пази 30 дни, преди да освободи мястото.

  ## Защо мястото ви още не е свободно

  Когато изтривате снимки на iPhone, било със Swipe2delete, с друго приложение или със самото приложение Снимки, iOS не ги премахва веднага. То ги мести в албума **Наскоро изтрити**, където те стоят **30 дни** като предпазна мярка, в случай че размислите. Докато този албум не бъде изпразнен, снимките продължават да заемат място.

  **Решението:** изпразнете албума Наскоро изтрити ръчно и мястото се освобождава веднага.

  ## Стъпка по стъпка: изпразнете Наскоро изтрити

  ### 1. Отворете приложението Снимки

  Докоснете иконата **Снимки** на началния екран.

  ![Приложението Снимки на началния екран](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Превъртете до Наскоро изтрити

  Превъртете надолу до секцията **Помощни средства** и докоснете **Наскоро изтрити**. (В по-старите версии на iOS се намира под Албуми.)

  ![Наскоро изтрити в Помощни средства](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Изпразнете албума

  Докоснете **Избери** горе вдясно, след това докоснете **Изтрий всички** долу вляво.

  ![Избери в Наскоро изтрити](/assets/guides/empty-recently-deleted/select.webp)

  ![Изтрий всички в Наскоро изтрити](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Потвърдете

  Докоснете **Изтрий от всички устройства**, за да ги премахнете окончателно.

  ![Изскачащ прозорец за потвърждение на изтриването на снимки](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Готово!** Мястото се освобождава веднага, на вашия iPhone и в iCloud, ако използвате Снимки в iCloud.

  ## Колко място ще си върна?

  Албумът Наскоро изтрити показва общия си размер най-отгоре. След едно истинско разчистване на галерията той често е значителен:

  - Леко разчистване: 500MB - 2GB
  - Редовно разчистване: 2GB - 5GB
  - Голямо разчистване: 5GB - 10GB+

  ## Добре е да знаете

  ⚠️ **Изпразването на Наскоро изтрити не може да бъде отменено.** Прегледайте набързо албума, преди да изтриете всичко. Това е последният ви шанс да спасите снимка.

  💡 **Изобщо не сте длъжни да го правите.** Ако не бързате, iOS изпразва албума автоматично, 30 дни след изтриването на всяка снимка. Ръчното изпразване просто ви дава мястото сега.

  💡 **Направете го навик.** След всяка сесия на разчистване изпразнете Наскоро изтрити веднъж. Точно тогава мястото наистина се връща.
