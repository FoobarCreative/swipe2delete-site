title: "Has esborrat fotos però continues sense espai? Buida Eliminat recentment a l'iPhone"
short_title: "Buidar Eliminat recentment"
description: "Les fotos esborrades continuen ocupant espai durant 30 dies a l'àlbum Eliminat recentment. Aquí tens com buidar-lo i alliberar espai a l'iPhone a l'instant."
cta_label: "Obre Fotos →"
body: |
  Has netejat el carret, però la barra d'emmagatzematge no s'ha mogut. Tranquil: les teves fotos estan realment esborrades. iOS simplement les guarda 30 dies abans de deixar anar l'espai.

  ## Per què encara no tens l'espai lliure

  Quan esborres fotos en un iPhone, amb Swipe2delete, una altra app o la mateixa app Fotos, iOS no les elimina immediatament. Les mou a l'àlbum **Eliminat recentment**, on es queden **30 dies** com a xarxa de seguretat per si canvies d'opinió. Fins que aquest àlbum no es buida, les fotos continuen ocupant espai.

  **La solució:** buida l'àlbum Eliminat recentment manualment i recuperaràs l'espai de seguida.

  ## Pas a pas: buidar Eliminat recentment

  ### 1. Obre l'app Fotos

  Toca la icona de **Fotos** a la pantalla d'inici.

  ![App Fotos a la pantalla d'inici](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Desplaça't fins a Eliminat recentment

  Desplaça't cap avall fins a la secció **Utilitats** i toca **Eliminat recentment**. (En versions d'iOS més antigues és dins d'Àlbums.)

  ![Eliminat recentment dins d'Utilitats](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Buida l'àlbum

  Toca **Seleccionar** a dalt a la dreta i després toca **Eliminar-ho tot** a baix a l'esquerra.

  ![Botó Seleccionar a Eliminat recentment](/assets/guides/empty-recently-deleted/select.webp)

  ![Botó Eliminar-ho tot a Eliminat recentment](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Confirma

  Toca **Eliminar de tots els dispositius** per eliminar-les definitivament.

  ![Finestra de confirmació per esborrar les fotos](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Fet!** L'espai s'allibera immediatament, al teu iPhone i a iCloud si fas servir Fotos a l'iCloud.

  ## Quant espai recuperaré?

  L'àlbum Eliminat recentment mostra la seva mida total a la part superior. Després d'una bona neteja del carret sol ser considerable:

  - Neteja lleugera: 500MB - 2GB
  - Neteja habitual: 2GB - 5GB
  - Neteja gran: 5GB - 10GB+

  ## Bo de saber

  ⚠️ **Buidar Eliminat recentment no es pot desfer.** Fes-hi una ullada ràpida abans d'esborrar-ho tot. És la teva última oportunitat de rescatar una foto.

  💡 **No cal que ho facis.** Si no tens pressa, iOS buida l'àlbum automàticament, 30 dies després que cada foto s'hagi esborrat. Buidar-lo manualment només et dona l'espai ara mateix.

  💡 **Converteix-ho en un hàbit.** Després de cada sessió de neteja, buida Eliminat recentment un cop. És llavors quan l'espai torna de debò.
