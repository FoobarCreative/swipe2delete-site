title: "Διαγράψατε φωτογραφίες αλλά δεν υπάρχει χώρος; Αδειάστε τα Πρόσφατα διαγραμμένα στο iPhone"
short_title: "Άδειασμα Πρόσφατα διαγραμμένων"
description: "Οι διαγραμμένες φωτογραφίες συνεχίζουν να καταλαμβάνουν χώρο για 30 ημέρες στο άλμπουμ Πρόσφατα διαγραμμένα. Δείτε πώς να το αδειάσετε και να ελευθερώσετε χώρο στο iPhone σας αμέσως."
cta_label: "Άνοιγμα Φωτογραφιών →"
body: |
  Ξεκαθαρίσατε τη συλλογή σας, αλλά η μπάρα αποθηκευτικού χώρου δεν κουνήθηκε. Μην ανησυχείτε: οι φωτογραφίες σας έχουν πράγματι διαγραφεί. Το iOS απλώς τις κρατά για 30 ημέρες πριν ελευθερώσει τον χώρο.

  ## Γιατί ο χώρος σας δεν έχει ελευθερωθεί ακόμα

  Όταν διαγράφετε φωτογραφίες σε iPhone, είτε με το Swipe2delete, είτε με άλλη εφαρμογή, είτε με την ίδια την εφαρμογή Φωτογραφίες, το iOS δεν τις αφαιρεί αμέσως. Τις μεταφέρει στο άλμπουμ **Πρόσφατα διαγραμμένα**, όπου μένουν για **30 ημέρες** ως δίχτυ ασφαλείας σε περίπτωση που αλλάξετε γνώμη. Μέχρι να αδειάσει αυτό το άλμπουμ, οι φωτογραφίες συνεχίζουν να καταλαμβάνουν χώρο.

  **Η λύση:** αδειάστε το άλμπουμ Πρόσφατα διαγραμμένα χειροκίνητα και ο χώρος ανακτάται αμέσως.

  ## Βήμα προς βήμα: αδειάστε τα Πρόσφατα διαγραμμένα

  ### 1. Ανοίξτε την εφαρμογή Φωτογραφίες

  Αγγίξτε το εικονίδιο **Φωτογραφίες** στην οθόνη Αφετηρίας.

  ![Η εφαρμογή Φωτογραφίες στην οθόνη Αφετηρίας](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Κατεβείτε στα Πρόσφατα διαγραμμένα

  Κατεβείτε στην ενότητα **Βοηθήματα** και αγγίξτε **Πρόσφατα διαγραμμένα**. (Σε παλαιότερες εκδόσεις iOS βρίσκεται στα Άλμπουμ.)

  ![Τα Πρόσφατα διαγραμμένα στην ενότητα Βοηθήματα](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Αδειάστε το άλμπουμ

  Αγγίξτε **Επιλογή** πάνω δεξιά και μετά **Διαγραφή όλων** κάτω αριστερά.

  ![Το κουμπί Επιλογή στα Πρόσφατα διαγραμμένα](/assets/guides/empty-recently-deleted/select.webp)

  ![Το κουμπί Διαγραφή όλων στα Πρόσφατα διαγραμμένα](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Επιβεβαιώστε

  Αγγίξτε **Διαγραφή από όλες τις συσκευές** για να τις αφαιρέσετε οριστικά.

  ![Αναδυόμενο παράθυρο επιβεβαίωσης διαγραφής φωτογραφιών](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Έτοιμο!** Ο χώρος ελευθερώνεται αμέσως, στο iPhone σας και στο iCloud αν χρησιμοποιείτε Φωτογραφίες iCloud.

  ## Πόσο χώρο θα πάρω πίσω;

  Το άλμπουμ Πρόσφατα διαγραμμένα δείχνει το συνολικό του μέγεθος στο πάνω μέρος. Μετά από ένα σωστό ξεκαθάρισμα της συλλογής είναι συχνά σημαντικός:

  - Ελαφρύ ξεκαθάρισμα: 500MB - 2GB
  - Κανονικό ξεκαθάρισμα: 2GB - 5GB
  - Μεγάλο ξεκαθάρισμα: 5GB - 10GB+

  ## Καλό να το γνωρίζετε

  ⚠️ **Το άδειασμα των Πρόσφατα διαγραμμένων δεν αναιρείται.** Ρίξτε μια γρήγορη ματιά πριν τα διαγράψετε όλα. Είναι η τελευταία σας ευκαιρία να σώσετε μια φωτογραφία.

  💡 **Δεν χρειάζεται καν να το κάνετε.** Αν δεν βιάζεστε, το iOS αδειάζει το άλμπουμ αυτόματα, 30 ημέρες μετά τη διαγραφή κάθε φωτογραφίας. Το χειροκίνητο άδειασμα απλώς σας δίνει τον χώρο τώρα.

  💡 **Κάντε το συνήθεια.** Μετά από κάθε συνεδρία ξεκαθαρίσματος, αδειάστε μία φορά τα Πρόσφατα διαγραμμένα. Τότε είναι που ο χώρος επιστρέφει πραγματικά.
