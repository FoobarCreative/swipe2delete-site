title: "מחקתם תמונות ועדיין אין מקום? כך מרוקנים את נמחקו לאחרונה ב-iPhone"
short_title: "ריקון נמחקו לאחרונה"
description: "תמונות שנמחקו ממשיכות לתפוס מקום אחסון במשך 30 יום באלבום נמחקו לאחרונה. כך מרוקנים אותו ומפנים מקום ב-iPhone מיד."
cta_label: "פתחו את התמונות →"
body: |
  ניקיתם את גליל הצילום, אבל פס האחסון לא זז. אל דאגה: התמונות שלכם באמת נמחקו. iOS פשוט שומר אותן 30 יום לפני שהוא משחרר את המקום.

  ## למה המקום עדיין לא התפנה

  כשמוחקים תמונות ב-iPhone, עם Swipe2delete, אפליקציה אחרת או אפליקציית התמונות עצמה, iOS לא מסיר אותן מיד. הוא מעביר אותן לאלבום **נמחקו לאחרונה**, שם הן נשארות **30 יום** כרשת ביטחון למקרה שתתחרטו. עד שהאלבום הזה מתרוקן, התמונות ממשיכות לתפוס מקום אחסון.

  **הפתרון:** רוקנו את האלבום נמחקו לאחרונה ידנית והמקום מתפנה מיד.

  ## שלב אחר שלב: ריקון נמחקו לאחרונה

  ### 1. פתחו את אפליקציית התמונות

  הקישו על סמל **תמונות** במסך הבית.

  ![אפליקציית התמונות במסך הבית](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. גללו אל נמחקו לאחרונה

  גללו מטה אל המקטע **כלי עזר** והקישו על **נמחקו לאחרונה**. (בגרסאות iOS ישנות יותר זה נמצא תחת אלבומים.)

  ![נמחקו לאחרונה בתוך כלי עזר](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. רוקנו את האלבום

  הקישו על **בחירה** בחלק העליון של המסך, ואז הקישו על **מחק הכול** בחלק התחתון.

  ![כפתור בחירה בנמחקו לאחרונה](/assets/guides/empty-recently-deleted/select.webp)

  ![כפתור מחק הכול בנמחקו לאחרונה](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. אשרו

  הקישו על **מחק מכל המכשירים** כדי להסיר אותן לצמיתות.

  ![חלונית אישור מחיקת תמונות](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **זהו!** המקום מתפנה מיד, ב-iPhone וגם ב-iCloud אם אתם משתמשים בתמונות iCloud.

  ## כמה מקום אקבל בחזרה?

  האלבום נמחקו לאחרונה מציג את הגודל הכולל שלו בחלק העליון. אחרי ניקוי יסודי של גליל הצילום מדובר לרוב בלא מעט:

  - ניקוי קל: 500MB - 2GB
  - ניקוי רגיל: 2GB - 5GB
  - ניקוי גדול: 5GB - 10GB+

  ## טוב לדעת

  ⚠️ **ריקון נמחקו לאחרונה הוא בלתי הפיך.** עברו במהירות על האלבום לפני שאתם מוחקים הכול. זו ההזדמנות האחרונה להציל תמונה.

  💡 **אתם בכלל לא חייבים לעשות את זה.** אם אתם לא ממהרים, iOS מרוקן את האלבום אוטומטית, 30 יום אחרי שכל תמונה נמחקה. ריקון ידני רק נותן לכם את המקום עכשיו.

  💡 **הפכו את זה להרגל.** אחרי כל ניקוי, רוקנו את נמחקו לאחרונה פעם אחת. זה הרגע שבו המקום באמת חוזר.
