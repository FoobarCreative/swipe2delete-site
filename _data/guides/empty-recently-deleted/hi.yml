title: "फ़ोटो डिलीट कर दीं फिर भी जगह खाली नहीं? iPhone पर हाल ही में डिलीट किया गया खाली करें"
short_title: "हाल ही में डिलीट किया गया खाली करें"
description: "डिलीट की गई फ़ोटो हाल ही में डिलीट किया गया ऐल्बम में 30 दिनों तक स्टोरेज घेरती रहती हैं। जानिए इसे खाली करके अपने iPhone पर तुरंत जगह कैसे बनाएँ।"
cta_label: "फ़ोटो खोलें →"
body: |
  आपने कैमरा रोल साफ़ कर लिया, लेकिन स्टोरेज बार टस से मस नहीं हुआ। चिंता न करें: आपकी फ़ोटो सच में डिलीट हो चुकी हैं। बस iOS जगह छोड़ने से पहले उन्हें 30 दिनों तक रोके रखता है।

  ## आपका स्टोरेज अभी तक खाली क्यों नहीं हुआ

  जब आप iPhone पर फ़ोटो डिलीट करते हैं, चाहे Swipe2delete से, किसी और ऐप से या ख़ुद फ़ोटो ऐप से, iOS उन्हें तुरंत नहीं हटाता। वह उन्हें **हाल ही में डिलीट किया गया** ऐल्बम में भेज देता है, जहाँ वे सुरक्षा के तौर पर **30 दिनों** तक रहती हैं, ताकि मन बदलने पर आप उन्हें वापस पा सकें। जब तक वह ऐल्बम खाली नहीं होता, फ़ोटो स्टोरेज घेरे रहती हैं।

  **उपाय:** हाल ही में डिलीट किया गया ऐल्बम मैन्युअली खाली करें और जगह तुरंत वापस मिल जाती है।

  ## स्टेप-बाय-स्टेप: हाल ही में डिलीट किया गया खाली करें

  ### 1. फ़ोटो ऐप खोलें

  होम स्क्रीन पर **फ़ोटो** आइकॉन टैप करें।

  ![होम स्क्रीन पर फ़ोटो ऐप](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. स्क्रॉल करके हाल ही में डिलीट किया गया तक जाएँ

  नीचे स्क्रॉल करके **यूटिलिटीज़** सेक्शन तक जाएँ और **हाल ही में डिलीट किया गया** टैप करें। (iOS के पुराने वर्ज़न में यह ऐल्बम के नीचे मिलता है।)

  ![यूटिलिटीज़ में हाल ही में डिलीट किया गया](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. ऐल्बम खाली करें

  ऊपर दाईं ओर **चुनें** टैप करें, फिर नीचे बाईं ओर **सभी डिलीट करें** टैप करें।

  ![हाल ही में डिलीट किया गया में चुनें बटन](/assets/guides/empty-recently-deleted/select.webp)

  ![हाल ही में डिलीट किया गया में सभी डिलीट करें बटन](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. पुष्टि करें

  उन्हें स्थायी रूप से हटाने के लिए **सभी डिवाइस से डिलीट करें** टैप करें।

  ![फ़ोटो डिलीट करने की पुष्टि वाला पॉपअप](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **हो गया!** स्टोरेज तुरंत खाली हो जाता है, आपके iPhone पर और अगर आप iCloud फ़ोटो इस्तेमाल करते हैं तो iCloud में भी।

  ## मुझे कितनी जगह वापस मिलेगी?

  हाल ही में डिलीट किया गया ऐल्बम अपने सबसे ऊपर कुल साइज़ दिखाता है। कैमरा रोल की ढंग से सफ़ाई के बाद यह अक्सर काफ़ी बड़ा होता है:

  - हल्की सफ़ाई: 500MB - 2GB
  - नियमित सफ़ाई: 2GB - 5GB
  - बड़ी सफ़ाई: 5GB - 10GB+

  ## जानने लायक़ बातें

  ⚠️ **हाल ही में डिलीट किया गया खाली करने के बाद उसे अनडू नहीं किया जा सकता।** सब कुछ डिलीट करने से पहले एक बार झटपट नज़र डाल लें। किसी फ़ोटो को बचाने का यह आख़िरी मौक़ा है।

  💡 **यह करना ज़रूरी नहीं है।** अगर आपको जल्दी नहीं है, तो iOS हर फ़ोटो के डिलीट होने के 30 दिनों बाद ऐल्बम अपने आप खाली कर देता है। मैन्युअली खाली करने से बस आपको जगह अभी मिल जाती है।

  💡 **इसे आदत बना लें।** हर सफ़ाई सेशन के बाद एक बार हाल ही में डिलीट किया गया खाली करें। स्टोरेज असल में तभी वापस आता है।
