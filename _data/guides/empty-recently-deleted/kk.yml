title: "Фотоларды жойдыңыз, бірақ орын әлі жоқ па? iPhone-да Жақында жойылған альбомын босату"
short_title: "Жақында жойылғанды босату"
description: "Жойылған фотолар Жақында жойылған альбомында 30 күн бойы жадта орын алып тұрады. iPhone-да бұл альбомды босатып, орынды бірден қалай босатуға болатынын көрсетеміз."
cta_label: "Photos-ты ашу →"
body: |
  Галереяңызды тазаладыңыз, бірақ жад көрсеткіші өзгерген жоқ. Алаңдамаңыз: фотоларыңыз шынымен жойылған. Тек iOS орынды босатпас бұрын оларды 30 күн сақтап тұрады.

  ## Орын неге әлі босамады

  iPhone-да фото жойғанда, Swipe2delete-пен бе, басқа қолданбамен бе, әлде Photos қолданбасының өзімен бе, iOS оларды бірден өшірмейді. Оларды **Жақында жойылған** альбомына көшіреді де, райыңыздан қайтқан жағдайға қауіпсіздік торы ретінде **30 күн** сонда ұстайды. Бұл альбом босатылмайынша фотолар жадта орын алып тұра береді.

  **Шешімі:** Жақында жойылған альбомын қолмен босатыңыз, сонда орын бірден қайтады.

  ## Қадам-қадаммен: Жақында жойылғанды босату

  ### 1. Photos қолданбасын ашыңыз

  Негізгі экрандағы **Photos** белгішесін басыңыз.

  ![Негізгі экрандағы Photos қолданбасы](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Жақында жойылған бөліміне өтіңіз

  Төмен қарай айналдырып, **Құралдар** бөліміне жетіңіз де, **Жақында жойылған** дегенді басыңыз. (Ескілеу iOS нұсқаларында ол Альбомдар ішінде.)

  ![Құралдар бөліміндегі Жақында жойылған](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Альбомды босатыңыз

  Жоғарғы оң жақтағы **Таңдау** түймесін, содан кейін төменгі сол жақтағы **Барлығын жою** түймесін басыңыз.

  ![Жақында жойылған альбомындағы Таңдау түймесі](/assets/guides/empty-recently-deleted/select.webp)

  ![Жақында жойылған альбомындағы Барлығын жою түймесі](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Растаңыз

  Фотоларды біржола өшіру үшін **Барлық құрылғылардан жою** түймесін басыңыз.

  ![Фотоларды жоюды растау терезесі](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Дайын!** Орын бірден босайды: iPhone-да да, iCloud Photos қолдансаңыз, iCloud-та да.

  ## Қанша орын қайтады?

  Жақында жойылған альбомы жалпы көлемін жоғарыда көрсетеді. Галереяны жақсылап тазалағаннан кейін ол көбіне едәуір болады:

  - Жеңіл тазалау: 500MB - 2GB
  - Қалыпты тазалау: 2GB - 5GB
  - Үлкен тазалау: 5GB - 10GB+

  ## Білген жөн

  ⚠️ **Жақында жойылғанды босатуды кері қайтару мүмкін емес.** Бәрін жоймас бұрын альбомды жылдам қарап шығыңыз. Бұл қандай да бір фотоны құтқарудың соңғы мүмкіндігі.

  💡 **Мұны істемесеңіз де болады.** Асықпасаңыз, iOS альбомды автоматты түрде босатады: әр фото жойылғаннан кейін 30 күн өткенде. Қолмен босату орынды дәл қазір ғана береді.

  💡 **Мұны әдетке айналдырыңыз.** Әр тазалау сеансынан кейін Жақында жойылғанды бір рет босатыңыз. Жад нақ сол кезде шынымен қайтады.
