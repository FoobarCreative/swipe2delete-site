title: "Ištrynėte nuotraukas, bet vietos vis tiek nėra? Ištuštinkite Neseniai ištrinta savo iPhone"
short_title: "Ištuštinti Neseniai ištrinta"
description: "Ištrintos nuotraukos dar 30 dienų užima vietą albume Neseniai ištrinta. Štai kaip jį ištuštinti ir iš karto atlaisvinti vietos savo iPhone."
cta_label: "Atverti Photos →"
body: |
  Susitvarkėte galeriją, bet saugyklos juosta nė nekrustelėjo. Nesijaudinkite: jūsų nuotraukos tikrai ištrintos. iOS tiesiog laiko jas 30 dienų, kol atlaisvina vietą.

  ## Kodėl vieta dar neatsilaisvino

  Kai iPhone ištrinate nuotraukas, ar per Swipe2delete, ar per kitą programą, ar pačioje Photos programoje, iOS jų nepašalina iš karto. Jos perkeliamos į albumą **Neseniai ištrinta**, kur kaip apsauga išlieka **30 dienų**, jei persigalvotumėte. Kol šis albumas neištuštintas, nuotraukos toliau užima vietą saugykloje.

  **Sprendimas:** ištuštinkite albumą Neseniai ištrinta rankiniu būdu ir vieta atsilaisvins iš karto.

  ## Žingsnis po žingsnio: kaip ištuštinti Neseniai ištrinta

  ### 1. Atverkite Photos programą

  Pradžios ekrane palieskite **Photos** piktogramą.

  ![Photos programa pradžios ekrane](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Slinkite iki Neseniai ištrinta

  Slinkite žemyn iki skilties **Įrankiai** ir palieskite **Neseniai ištrinta**. (Senesnėse iOS versijose rasite prie albumų.)

  ![Neseniai ištrinta skiltyje Įrankiai](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Ištuštinkite albumą

  Viršuje dešinėje palieskite **Pasirinkti**, tada apačioje kairėje palieskite **Ištrinti viską**.

  ![Mygtukas Pasirinkti albume Neseniai ištrinta](/assets/guides/empty-recently-deleted/select.webp)

  ![Mygtukas Ištrinti viską albume Neseniai ištrinta](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Patvirtinkite

  Palieskite **Ištrinti iš visų įrenginių**, kad pašalintumėte jas visam laikui.

  ![Nuotraukų trynimo patvirtinimo langas](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Atlikta!** Vieta atlaisvinama iš karto: jūsų iPhone ir, jei naudojate iCloud Photos, taip pat iCloud.

  ## Kiek vietos atgausiu?

  Albumas Neseniai ištrinta viršuje rodo bendrą savo dydį. Po gero galerijos tvarkymo jis dažnai būna nemažas:

  - Lengvas valymas: 500MB - 2GB
  - Įprastas valymas: 2GB - 5GB
  - Didelis valymas: 5GB - 10GB+

  ## Verta žinoti

  ⚠️ **Ištuštinus Neseniai ištrinta, veiksmo atšaukti nebegalima.** Prieš viską ištrindami greitai peržvelkite albumą. Tai paskutinė proga išgelbėti nuotrauką.

  💡 **To daryti apskritai neprivalote.** Jei neskubate, iOS albumą ištuština automatiškai, praėjus 30 dienų nuo kiekvienos nuotraukos ištrynimo. Ištuštinę rankiniu būdu vietą tiesiog gaunate dabar.

  💡 **Paverskite tai įpročiu.** Po kiekvieno tvarkymosi vieną kartą ištuštinkite Neseniai ištrinta. Būtent tada vieta iš tikrųjų sugrįžta.
