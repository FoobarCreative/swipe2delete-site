title: "Foto's verwijderd maar nog steeds geen ruimte? Recent verwijderd legen op je iPhone"
short_title: "Recent verwijderd legen"
description: "Verwijderde foto's blijven 30 dagen opslagruimte gebruiken in het album Recent verwijderd. Zo leeg je het album en maak je direct ruimte vrij op je iPhone."
cta_label: "Open Foto's →"
body: |
  Je hebt je filmrol opgeruimd, maar de opslagbalk is niet veranderd. Geen zorgen: je foto's zijn echt verwijderd. iOS houdt ze alleen 30 dagen vast voordat de ruimte vrijkomt.

  ## Waarom je opslag nog niet vrij is

  Wanneer je foto's verwijdert op een iPhone, of dat nu met Swipe2delete, een andere app of de Foto's-app zelf is, wist iOS ze niet meteen. Ze verhuizen naar het album **Recent verwijderd**, waar ze **30 dagen** blijven staan als vangnet voor het geval je je bedenkt. Zolang dat album niet wordt geleegd, blijven de foto's opslagruimte innemen.

  **De oplossing:** leeg het album Recent verwijderd handmatig en de ruimte komt direct vrij.

  ## Stap voor stap: Recent verwijderd legen

  ### 1. Open de Foto's-app

  Tik op het **Foto's**-symbool op je beginscherm.

  ![Foto's-app op het beginscherm](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Scrol naar Recent verwijderd

  Scrol omlaag naar het gedeelte **Hulpmiddelen** en tik op **Recent verwijderd**. (In oudere iOS-versies staat het onder Albums.)

  ![Recent verwijderd onder Hulpmiddelen](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Leeg het album

  Tik rechtsboven op **Selecteer** en daarna linksonder op **Verwijder alles**.

  ![Selecteer in Recent verwijderd](/assets/guides/empty-recently-deleted/select.webp)

  ![Verwijder alles in Recent verwijderd](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Bevestig

  Tik op **Verwijder van alle apparaten** om ze definitief te wissen.

  ![Bevestigingsvenster voor het verwijderen van foto's](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Klaar!** De opslagruimte komt meteen vrij, op je iPhone en in iCloud als je iCloud-foto's gebruikt.

  ## Hoeveel ruimte krijg ik terug?

  Het album Recent verwijderd toont bovenaan de totale grootte. Na een flinke opruimronde van je filmrol is dat vaak behoorlijk wat:

  - Lichte opruimbeurt: 500 MB - 2 GB
  - Gewone opruimbeurt: 2 GB - 5 GB
  - Grote opruimbeurt: 5 GB - 10 GB+

  ## Goed om te weten

  ⚠️ **Recent verwijderd legen kan niet ongedaan worden gemaakt.** Scrol er even snel doorheen voordat je alles verwijdert. Het is je laatste kans om een foto te redden.

  💡 **Je hoeft dit helemaal niet te doen.** Heb je geen haast, dan leegt iOS het album automatisch, 30 dagen nadat elke foto is verwijderd. Handmatig legen levert je de ruimte alleen nu al op.

  💡 **Maak er een gewoonte van.** Leeg na elke opruimsessie één keer Recent verwijderd. Dat is het moment waarop de opslag echt terugkomt.
