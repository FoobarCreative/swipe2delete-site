title: "Zdjęcia usunięte, a miejsca wciąż brak? Opróżnij album Ostatnio usunięte na iPhonie"
short_title: "Opróżnij Ostatnio usunięte"
description: "Usunięte zdjęcia zajmują miejsce jeszcze przez 30 dni w albumie Ostatnio usunięte. Zobacz, jak go opróżnić i natychmiast zwolnić miejsce na iPhonie."
cta_label: "Otwórz Zdjęcia →"
body: |
  Po porządkach w rolce aparatu pasek miejsca ani drgnął. Spokojnie: Twoje zdjęcia naprawdę są usunięte. iOS po prostu przechowuje je jeszcze przez 30 dni, zanim zwolni miejsce.

  ## Dlaczego miejsce wciąż nie jest wolne

  Gdy usuwasz zdjęcia na iPhonie, czy to w Swipe2delete, w innej aplikacji, czy w samej aplikacji Zdjęcia, iOS nie usuwa ich od razu. Przenosi je do albumu **Ostatnio usunięte**, gdzie czekają **30 dni** jako zabezpieczenie na wypadek zmiany zdania. Dopóki ten album nie zostanie opróżniony, zdjęcia nadal zajmują miejsce.

  **Rozwiązanie:** opróżnij album Ostatnio usunięte ręcznie, a miejsce zostanie odzyskane od razu.

  ## Krok po kroku: opróżnij Ostatnio usunięte

  ### 1. Otwórz aplikację Zdjęcia

  Stuknij ikonę **Zdjęcia** na ekranie początkowym.

  ![Aplikacja Zdjęcia na ekranie początkowym](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Przewiń do albumu Ostatnio usunięte

  Przewiń w dół do sekcji **Narzędzia** i stuknij **Ostatnio usunięte**. (W starszych wersjach iOS album znajdziesz w Albumach.)

  ![Ostatnio usunięte w sekcji Narzędzia](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Opróżnij album

  Stuknij **Wybierz** w prawym górnym rogu, a następnie **Usuń wszystkie** w lewym dolnym rogu.

  ![Opcja Wybierz w albumie Ostatnio usunięte](/assets/guides/empty-recently-deleted/select.webp)

  ![Opcja Usuń wszystkie w albumie Ostatnio usunięte](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Potwierdź

  Stuknij **Usuń ze wszystkich urządzeń**, aby trwale je usunąć.

  ![Okno potwierdzenia usunięcia zdjęć](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Gotowe!** Miejsce zwalnia się natychmiast, na Twoim iPhonie oraz w iCloud, jeśli korzystasz ze Zdjęć iCloud.

  ## Ile miejsca odzyskam?

  Album Ostatnio usunięte pokazuje u góry swój łączny rozmiar. Po porządnym uprzątnięciu rolki aparatu bywa on spory:

  - Lekkie porządki: 500MB - 2GB
  - Zwykłe porządki: 2GB - 5GB
  - Wielkie porządki: 5GB - 10GB+

  ## Warto wiedzieć

  ⚠️ **Opróżnienia albumu Ostatnio usunięte nie da się cofnąć.** Przejrzyj go szybko, zanim wszystko usuniesz. To ostatnia szansa, aby uratować jakieś zdjęcie.

  💡 **Wcale nie musisz tego robić.** Jeśli się nie spieszysz, iOS opróżnia album automatycznie, 30 dni po usunięciu każdego zdjęcia. Ręczne opróżnienie po prostu daje Ci miejsce już teraz.

  💡 **Zrób z tego nawyk.** Po każdej sesji porządków opróżnij raz album Ostatnio usunięte. Właśnie wtedy miejsce naprawdę wraca.
