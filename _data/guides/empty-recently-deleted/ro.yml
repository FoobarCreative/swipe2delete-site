title: "Ai șters poze, dar tot nu ai spațiu? Golește albumul Șterse recent pe iPhone"
short_title: "Golește Șterse recent"
description: "Pozele șterse ocupă spațiu încă 30 de zile în albumul Șterse recent. Iată cum să îl golești și să eliberezi imediat spațiu pe iPhone."
cta_label: "Deschide Poze →"
body: |
  Ai făcut curat în galeria foto, dar bara de stocare nu s-a clintit. Nicio grijă: pozele tale chiar sunt șterse. iOS doar le păstrează 30 de zile înainte de a elibera spațiul.

  ## De ce spațiul tău nu s-a eliberat încă

  Când ștergi poze pe un iPhone, fie cu Swipe2delete, fie cu altă aplicație, fie chiar din aplicația Poze, iOS nu le elimină imediat. Le mută în albumul **Șterse recent**, unde stau **30 de zile** ca plasă de siguranță, în caz că te răzgândești. Până când acest album nu este golit, pozele continuă să ocupe spațiu.

  **Soluția:** golește manual albumul Șterse recent și spațiul este recuperat imediat.

  ## Pas cu pas: golește Șterse recent

  ### 1. Deschide aplicația Poze

  Atinge pictograma **Poze** de pe ecranul principal.

  ![Aplicația Poze pe ecranul principal](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Derulează până la Șterse recent

  Derulează în jos până la secțiunea **Utilitare** și atinge **Șterse recent**. (În versiunile mai vechi de iOS se află la Albume.)

  ![Șterse recent în secțiunea Utilitare](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Golește albumul

  Atinge **Selectați** în dreapta sus, apoi atinge **Ștergeți tot** în stânga jos.

  ![Butonul Selectați în Șterse recent](/assets/guides/empty-recently-deleted/select.webp)

  ![Butonul Ștergeți tot în Șterse recent](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Confirmă

  Atinge **Ștergeți de pe toate dispozitivele** pentru a le elimina definitiv.

  ![Fereastra de confirmare a ștergerii pozelor](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Gata!** Spațiul se eliberează imediat, pe iPhone-ul tău și în iCloud, dacă folosești Poze iCloud.

  ## Cât spațiu voi recupera?

  Albumul Șterse recent își arată dimensiunea totală în partea de sus. După o curățare serioasă a galeriei foto, aceasta este adesea considerabilă:

  - Curățare ușoară: 500MB - 2GB
  - Curățare obișnuită: 2GB - 5GB
  - Curățare mare: 5GB - 10GB+

  ## Bine de știut

  ⚠️ **Golirea albumului Șterse recent nu poate fi anulată.** Derulează rapid prin album înainte să ștergi tot. Este ultima ta șansă să salvezi o poză.

  💡 **Nu ești obligat să faci asta deloc.** Dacă nu te grăbești, iOS golește albumul automat, la 30 de zile după ștergerea fiecărei poze. Golirea manuală îți aduce doar spațiul acum.

  💡 **Fă din asta un obicei.** După fiecare sesiune de curățare, golește o dată Șterse recent. Abia atunci spațiul chiar revine.
