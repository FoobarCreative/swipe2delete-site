title: "Удалили фото, а места все нет? Очистите альбом «Недавно удаленные» на iPhone"
short_title: "Очистить «Недавно удаленные»"
description: "Удаленные фото занимают память еще 30 дней в альбоме «Недавно удаленные». Рассказываем, как очистить его и сразу освободить место на iPhone."
cta_label: "Открыть «Фото» →"
body: |
  Вы разобрали фотопленку, а индикатор хранилища даже не сдвинулся. Не волнуйтесь: ваши фото действительно удалены. iOS просто хранит их еще 30 дней, прежде чем освободить место.

  ## Почему место еще не освободилось

  Когда вы удаляете фото на iPhone, через Swipe2delete, другое приложение или само приложение «Фото», iOS не убирает их сразу. Она перемещает их в альбом **«Недавно удаленные»**, где они лежат **30 дней** в качестве подстраховки на случай, если вы передумаете. Пока этот альбом не очищен, фото продолжают занимать место.

  **Решение:** очистите альбом «Недавно удаленные» вручную, и место освободится сразу же.

  ## Пошагово: как очистить «Недавно удаленные»

  ### 1. Откройте приложение «Фото»

  Нажмите значок **«Фото»** на экране «Домой».

  ![Приложение «Фото» на экране «Домой»](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Пролистайте до «Недавно удаленных»

  Пролистайте вниз до раздела **«Утилиты»** и нажмите **«Недавно удаленные»**. (В старых версиях iOS альбом находится в разделе «Альбомы».)

  ![«Недавно удаленные» в разделе «Утилиты»](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Очистите альбом

  Нажмите **«Выбрать»** в правом верхнем углу, затем **«Удалить все»** в левом нижнем углу.

  ![Кнопка «Выбрать» в альбоме «Недавно удаленные»](/assets/guides/empty-recently-deleted/select.webp)

  ![Кнопка «Удалить все» в альбоме «Недавно удаленные»](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Подтвердите

  Нажмите **«Удалить со всех устройств»**, чтобы удалить их окончательно.

  ![Окно подтверждения удаления фото](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Готово!** Место освобождается сразу, на вашем iPhone и в iCloud, если вы используете Фото iCloud.

  ## Сколько места я получу обратно?

  Вверху альбома «Недавно удаленные» показан его общий размер. После хорошей уборки фотопленки он часто оказывается внушительным:

  - Легкая уборка: 500MB - 2GB
  - Обычная уборка: 2GB - 5GB
  - Большая уборка: 5GB - 10GB+

  ## Полезно знать

  ⚠️ **Очистку «Недавно удаленных» нельзя отменить.** Быстро пролистайте альбом, прежде чем удалять все. Это последний шанс спасти какое-нибудь фото.

  💡 **Делать это вообще не обязательно.** Если вы не спешите, iOS очищает альбом автоматически, через 30 дней после удаления каждого фото. Ручная очистка просто дает вам место прямо сейчас.

  💡 **Сделайте это привычкой.** После каждой уборки один раз очищайте «Недавно удаленные». Именно тогда место действительно возвращается.
