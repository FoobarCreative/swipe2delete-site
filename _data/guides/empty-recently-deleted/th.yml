title: "ลบรูปแล้วแต่พื้นที่ยังไม่ว่าง? วิธีล้างอัลบั้มลบล่าสุดบน iPhone"
short_title: "ล้างอัลบั้มลบล่าสุด"
description: "รูปที่ลบไปยังคงกินพื้นที่ต่ออีก 30 วันในอัลบั้มลบล่าสุด นี่คือวิธีล้างอัลบั้มนี้เพื่อคืนพื้นที่ว่างบน iPhone ของคุณทันที"
cta_label: "เปิดแอปรูปภาพ →"
body: |
  คุณเคลียร์คลังรูปไปแล้ว แต่แถบพื้นที่จัดเก็บกลับไม่ขยับเลย ไม่ต้องกังวล รูปของคุณถูกลบจริงๆ เพียงแต่ iOS จะเก็บไว้อีก 30 วันก่อนคืนพื้นที่ให้

  ## ทำไมพื้นที่ของคุณยังไม่ว่าง

  เมื่อคุณลบรูปบน iPhone ไม่ว่าจะด้วย Swipe2delete แอปอื่น หรือแอปรูปภาพเอง iOS จะไม่ลบรูปออกทันที แต่จะย้ายไปยังอัลบั้ม **ลบล่าสุด** ซึ่งรูปจะอยู่ที่นั่นเป็นเวลา **30 วัน** เพื่อความปลอดภัยเผื่อคุณเปลี่ยนใจ ตราบใดที่อัลบั้มนี้ยังไม่ถูกล้าง รูปก็จะยังกินพื้นที่อยู่

  **วิธีแก้:** ล้างอัลบั้มลบล่าสุดด้วยตัวเอง แล้วพื้นที่จะถูกคืนให้ทันที

  ## ทีละขั้นตอน: ล้างอัลบั้มลบล่าสุด

  ### 1. เปิดแอปรูปภาพ

  แตะไอคอน **รูปภาพ** บนหน้าจอโฮม

  ![แอปรูปภาพบนหน้าจอโฮม](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. เลื่อนไปที่ลบล่าสุด

  เลื่อนลงไปที่ส่วน **ยูทิลิตี้** แล้วแตะ **ลบล่าสุด** (ใน iOS เวอร์ชันเก่าจะอยู่ใต้อัลบั้ม)

  ![ลบล่าสุดในส่วนยูทิลิตี้](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. ล้างอัลบั้ม

  แตะ **เลือก** ที่มุมขวาบน จากนั้นแตะ **ลบทั้งหมด** ที่มุมซ้ายล่าง

  ![ปุ่มเลือกในอัลบั้มลบล่าสุด](/assets/guides/empty-recently-deleted/select.webp)

  ![ปุ่มลบทั้งหมดในอัลบั้มลบล่าสุด](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. ยืนยัน

  แตะ **ลบออกจากอุปกรณ์ทั้งหมด** เพื่อลบรูปอย่างถาวร

  ![ป๊อปอัปยืนยันการลบรูป](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **เสร็จแล้ว!** พื้นที่ว่างกลับคืนมาทันที ทั้งบน iPhone และใน iCloud หากคุณใช้รูปภาพ iCloud

  ## ฉันจะได้พื้นที่คืนเท่าไร?

  อัลบั้มลบล่าสุดจะแสดงขนาดรวมไว้ที่ด้านบน หลังการเคลียร์คลังรูปครั้งใหญ่ ตัวเลขมักไม่น้อยเลย:

  - เคลียร์เบาๆ: 500MB - 2GB
  - เคลียร์ตามปกติ: 2GB - 5GB
  - เคลียร์ครั้งใหญ่: 5GB - 10GB+

  ## ควรรู้ไว้

  ⚠️ **การล้างอัลบั้มลบล่าสุดไม่สามารถย้อนกลับได้** เลื่อนดูรูปคร่าวๆ ก่อนลบทั้งหมด นี่คือโอกาสสุดท้ายที่จะช่วยรูปไว้

  💡 **จริงๆ แล้วคุณไม่ต้องทำก็ได้** หากไม่รีบ iOS จะล้างอัลบั้มให้อัตโนมัติ 30 วันหลังจากที่แต่ละรูปถูกลบ การล้างเองเพียงแค่ทำให้คุณได้พื้นที่คืนตอนนี้เลย

  💡 **ทำให้เป็นนิสัย** หลังจบการเคลียร์แต่ละครั้ง ให้ล้างอัลบั้มลบล่าสุดหนึ่งรอบ นั่นคือตอนที่พื้นที่จะกลับคืนมาจริงๆ
