title: "Видалили фото, а місця досі немає? Очистіть альбом «Нещодавно видалені» на iPhone"
short_title: "Очистити «Нещодавно видалені»"
description: "Видалені фото займають пам'ять ще 30 днів в альбомі «Нещодавно видалені». Розповідаємо, як очистити його і одразу звільнити місце на iPhone."
cta_label: "Відкрити «Фото» →"
body: |
  Ви розібрали фотоплівку, а індикатор сховища навіть не зрушив. Не хвилюйтеся: ваші фото справді видалені. iOS просто зберігає їх ще 30 днів, перш ніж звільнити місце.

  ## Чому місце ще не звільнилося

  Коли ви видаляєте фото на iPhone, через Swipe2delete, інший застосунок чи сам застосунок «Фото», iOS не прибирає їх одразу. Вона переміщує їх до альбому **«Нещодавно видалені»**, де вони лежать **30 днів** як підстраховка на випадок, якщо ви передумаєте. Поки цей альбом не очищено, фото продовжують займати місце.

  **Рішення:** очистіть альбом «Нещодавно видалені» вручну, і місце звільниться одразу ж.

  ## Покроково: як очистити «Нещодавно видалені»

  ### 1. Відкрийте застосунок «Фото»

  Натисніть іконку **«Фото»** на початковому екрані.

  ![Застосунок «Фото» на початковому екрані](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Прогорніть до «Нещодавно видалених»

  Прогорніть вниз до розділу **«Утиліти»** і натисніть **«Нещодавно видалені»**. (У старіших версіях iOS альбом розташований у розділі «Альбоми».)

  ![«Нещодавно видалені» у розділі «Утиліти»](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Очистіть альбом

  Натисніть **«Вибрати»** у правому верхньому куті, потім **«Видалити всі»** у лівому нижньому куті.

  ![Кнопка «Вибрати» в альбомі «Нещодавно видалені»](/assets/guides/empty-recently-deleted/select.webp)

  ![Кнопка «Видалити всі» в альбомі «Нещодавно видалені»](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Підтвердьте

  Натисніть **«Видалити з усіх пристроїв»**, щоб видалити їх остаточно.

  ![Вікно підтвердження видалення фото](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Готово!** Місце звільняється одразу, на вашому iPhone і в iCloud, якщо ви користуєтеся Фото iCloud.

  ## Скільки місця я поверну?

  Угорі альбому «Нещодавно видалені» показано його загальний розмір. Після хорошого прибирання фотоплівки він часто виявляється чималим:

  - Легке прибирання: 500MB - 2GB
  - Звичайне прибирання: 2GB - 5GB
  - Велике прибирання: 5GB - 10GB+

  ## Корисно знати

  ⚠️ **Очищення «Нещодавно видалених» не можна скасувати.** Швидко прогорніть альбом, перш ніж видаляти все. Це останній шанс врятувати якесь фото.

  💡 **Робити це взагалі не обов'язково.** Якщо ви не поспішаєте, iOS очищає альбом автоматично, через 30 днів після видалення кожного фото. Ручне очищення просто дає вам місце вже зараз.

  💡 **Зробіть це звичкою.** Після кожного прибирання один раз очищайте «Нещодавно видалені». Саме тоді місце справді повертається.
