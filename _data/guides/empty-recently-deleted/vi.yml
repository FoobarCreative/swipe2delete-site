title: "Đã xóa ảnh nhưng vẫn không có thêm dung lượng? Cách dọn sạch Đã xóa gần đây trên iPhone"
short_title: "Dọn sạch Đã xóa gần đây"
description: "Ảnh đã xóa vẫn chiếm dung lượng trong 30 ngày ở album Đã xóa gần đây. Đây là cách dọn sạch album này để giải phóng dung lượng iPhone ngay lập tức."
cta_label: "Mở Ảnh →"
body: |
  Bạn đã dọn thư viện ảnh, nhưng thanh dung lượng vẫn không nhúc nhích. Đừng lo: ảnh của bạn thực sự đã bị xóa. Chỉ là iOS còn giữ chúng 30 ngày trước khi trả lại dung lượng.

  ## Vì sao dung lượng vẫn chưa được giải phóng

  Khi bạn xóa ảnh trên iPhone, dù bằng Swipe2delete, ứng dụng khác hay chính ứng dụng Ảnh, iOS không xóa chúng ngay lập tức. Hệ thống chuyển ảnh vào album **Đã xóa gần đây**, nơi chúng nằm lại **30 ngày** như một lớp an toàn phòng khi bạn đổi ý. Chừng nào album này chưa được dọn sạch, ảnh vẫn tiếp tục chiếm dung lượng.

  **Cách khắc phục:** dọn sạch album Đã xóa gần đây theo cách thủ công và dung lượng được trả lại ngay lập tức.

  ## Từng bước: dọn sạch Đã xóa gần đây

  ### 1. Mở ứng dụng Ảnh

  Chạm vào biểu tượng **Ảnh** trên màn hình chính.

  ![Ứng dụng Ảnh trên màn hình chính](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. Cuộn đến Đã xóa gần đây

  Cuộn xuống mục **Tiện ích** và chạm vào **Đã xóa gần đây**. (Trên các phiên bản iOS cũ hơn, mục này nằm trong Album.)

  ![Đã xóa gần đây trong mục Tiện ích](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. Dọn sạch album

  Chạm **Chọn** ở góc trên bên phải, sau đó chạm **Xóa tất cả** ở góc dưới bên trái.

  ![Nút Chọn trong Đã xóa gần đây](/assets/guides/empty-recently-deleted/select.webp)

  ![Nút Xóa tất cả trong Đã xóa gần đây](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. Xác nhận

  Chạm **Xóa khỏi tất cả thiết bị** để xóa chúng vĩnh viễn.

  ![Hộp thoại xác nhận xóa ảnh](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **Xong!** Dung lượng được giải phóng ngay lập tức, trên iPhone của bạn và cả trong iCloud nếu bạn dùng Ảnh iCloud.

  ## Tôi sẽ lấy lại được bao nhiêu dung lượng?

  Album Đã xóa gần đây hiển thị tổng dung lượng ở phía trên. Sau một đợt dọn thư viện ảnh đàng hoàng, con số này thường khá đáng kể:

  - Dọn nhẹ: 500MB - 2GB
  - Dọn thường xuyên: 2GB - 5GB
  - Dọn lớn: 5GB - 10GB+

  ## Những điều nên biết

  ⚠️ **Dọn sạch Đã xóa gần đây là không thể hoàn tác.** Hãy lướt nhanh qua một lượt trước khi xóa tất cả. Đây là cơ hội cuối cùng để cứu lại một bức ảnh.

  💡 **Bạn hoàn toàn không bắt buộc phải làm việc này.** Nếu không vội, iOS sẽ tự động dọn album, 30 ngày sau khi mỗi bức ảnh bị xóa. Dọn thủ công chỉ giúp bạn có dung lượng ngay bây giờ.

  💡 **Hãy biến nó thành thói quen.** Sau mỗi phiên dọn dẹp, hãy dọn sạch Đã xóa gần đây một lần. Đó chính là lúc dung lượng thực sự quay về.
