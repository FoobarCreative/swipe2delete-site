title: "删除了照片但空间还是不够？在iPhone上清空最近删除"
short_title: "清空最近删除"
description: "删除的照片会在最近删除相册中继续占用空间30天。这里教你如何清空它，立即释放iPhone的存储空间。"
cta_label: "打开照片 →"
body: |
  你清理了相册，但存储条却纹丝不动。别担心：照片确实已经删掉了。只是iOS会先保留30天，之后才释放空间。

  ## 为什么空间还没有释放

  在iPhone上删除照片时，无论用Swipe2delete、其他应用还是照片App本身，iOS都不会立即移除它们。照片会被移到**最近删除**相册，在那里作为安全保障保留**30天**，以防你改变主意。在清空这个相册之前，照片会一直占用存储空间。

  **解决办法：**手动清空最近删除相册，空间立即回收。

  ## 分步操作：清空最近删除

  ### 1. 打开照片App

  在主屏幕上轻点**照片**图标。

  ![主屏幕上的照片App](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. 滚动到最近删除

  向下滚动到**实用工具**部分，轻点**最近删除**。（在较早的iOS版本中，它位于相册之下。）

  ![实用工具中的最近删除](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. 清空相册

  轻点右上角的**选择**，然后轻点左下角的**全部删除**。

  ![最近删除中的选择按钮](/assets/guides/empty-recently-deleted/select.webp)

  ![最近删除中的全部删除按钮](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. 确认

  轻点**从所有设备删除**，将它们永久移除。

  ![确认删除照片的弹窗](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **完成！**空间立即释放，iPhone上如此，如果你使用iCloud照片，iCloud里也一样。

  ## 我能拿回多少空间？

  最近删除相册顶部会显示其总大小。认真清理一次相册后，这个数字往往相当可观：

  - 轻度清理：500MB - 2GB
  - 常规清理：2GB - 5GB
  - 大扫除：5GB - 10GB+

  ## 温馨提示

  ⚠️ **清空最近删除后无法撤销。**删除全部之前快速翻看一遍，这是挽救照片的最后机会。

  💡 **你完全可以不做这一步。**如果不着急，iOS会在每张照片删除30天后自动清空该相册。手动清空只是让你现在就拿到空间。

  💡 **养成习惯。**每次清理完照片后，顺手清空一次最近删除。空间正是在这个时候真正回来的。
