title: "刪除了照片但空間還是不夠？在iPhone上清空最近刪除"
short_title: "清空最近刪除"
description: "刪除的照片會在最近刪除相簿中繼續佔用空間30天。這裡教你如何清空它，立即釋放iPhone的儲存空間。"
cta_label: "打開照片 →"
body: |
  你整理了相簿，但儲存空間的長條卻紋絲不動。別擔心：照片確實已經刪掉了。只是iOS會先保留30天，之後才釋放空間。

  ## 為什麼空間還沒有釋放

  在iPhone上刪除照片時，無論用Swipe2delete、其他App還是照片App本身，iOS都不會立即移除它們。照片會被移到**最近刪除**相簿，在那裡作為安全保障保留**30天**，以防你改變主意。在清空這個相簿之前，照片會一直佔用儲存空間。

  **解決辦法：**手動清空最近刪除相簿，空間立即取回。

  ## 分步操作：清空最近刪除

  ### 1. 打開照片App

  在主畫面上點一下**照片**圖示。

  ![主畫面上的照片App](/assets/guides/empty-recently-deleted/photos.webp)

  ### 2. 捲動到最近刪除

  向下捲動到**工具程式**部分，點一下**最近刪除**。（在較早的iOS版本中，它位於相簿之下。）

  ![工具程式中的最近刪除](/assets/guides/empty-recently-deleted/recently-deleted.webp)

  ### 3. 清空相簿

  點一下右上角的**選取**，然後點一下左下角的**全部刪除**。

  ![最近刪除中的選取按鈕](/assets/guides/empty-recently-deleted/select.webp)

  ![最近刪除中的全部刪除按鈕](/assets/guides/empty-recently-deleted/delete-all.webp)

  ### 4. 確認

  點一下**從所有裝置刪除**，將它們永久移除。

  ![確認刪除照片的彈出視窗](/assets/guides/empty-recently-deleted/delete-from-all-devices.webp)

  ✅ **完成！**空間立即釋放，iPhone上如此，如果你使用iCloud照片，iCloud裡也一樣。

  ## 我能取回多少空間？

  最近刪除相簿頂部會顯示其總大小。認真整理一次相簿後，這個數字往往相當可觀：

  - 輕度整理：500MB - 2GB
  - 一般整理：2GB - 5GB
  - 大掃除：5GB - 10GB+

  ## 貼心提醒

  ⚠️ **清空最近刪除後無法還原。**全部刪除之前快速翻看一遍，這是搶救照片的最後機會。

  💡 **你完全可以不做這一步。**如果不趕時間，iOS會在每張照片刪除30天後自動清空該相簿。手動清空只是讓你現在就拿到空間。

  💡 **養成習慣。**每次整理完照片後，順手清空一次最近刪除。空間正是在這個時候真正回來的。
