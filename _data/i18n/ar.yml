lang_name: العربية
hreflang: ar
flag: "🇸🇦"
rtl: true
page_title: "Swipe2delete: اسحب لحذف الصور وتنظيف مكتبة صورك"
app_subtitle: اسحب لحذف الصور وتنظيف مكتبة صورك
app_description: >-
  Swipe2delete هو منظّف الصور السريع والممتع لأجهزة iPhone و iPad.
  اسحب لليسار لحذف الصور، واسحب لليمين للاحتفاظ بها.
  نظّف مكتبة صورك شهرًا بعد شهر وحرّر مساحة التخزين.
features:
  - title: اسحب للتنظيم
    description: نظّف مكتبة صورك بسهولة بالسحب لليسار للحذف أو لليمين للاحتفاظ. طريقة بسيطة وفعّالة لترتيب صورك.
  - title: تنظيف شهري
    description: راجع صورك شهرًا بعد شهر بطريقة منظمة وسهلة الإنجاز. يُحفظ تقدمك مع كل دفعة.
  - title: ذكريات "في هذا اليوم"
    description: عِش لحظاتك المميزة من جديد. ميزة "في هذا اليوم" تعيد إليك صورًا من سنوات مضت لمراجعتها وترتيبها.
  - title: تراجع عن الأخطاء
    description: أخطأت في السحب؟ لا تقلق! اضغط على تراجع لاستعادة أي صورة حذفتها عن طريق الخطأ فورًا.
  - title: مراجعة نهائية
    description: قبل أن تنتهي، ألقِ نظرة أخيرة على الصور التي ستحتفظ بها وتلك التي ستحذفها، مع إمكانية التغيير في اللحظة الأخيرة.
  - title: متابعة التقدم
    description: تابع رحلة التنظيف عبر عجلة التقدم التي تعرض كم أنجزت وكم تبقى.
