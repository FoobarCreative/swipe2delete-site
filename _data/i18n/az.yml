lang_name: Azərbaycanca
hreflang: az
flag: "🇦🇿"
page_title: "Swipe2delete: sürüşdürərək şəkilləri silin və qalereyanı təmizləyin"
app_subtitle: Sürüşdürərək şəkilləri silin və qalereyanızı təmizləyin
app_description: >-
  Swipe2delete iPhone və iPad üçün sürətli və əyləncəli şəkil təmizləyicisidir.
  Şəkilləri silmək üçün sola, saxlamaq üçün sağa sürüşdürün.
  Qalereyanızı ay-ay təmizləyin və yaddaşda yer boşaldın.
features:
  - title: Sürüşdürüb qaydaya salın
    description: Silmək üçün sola, saxlamaq üçün sağa sürüşdürərək qalereyanızı asanlıqla təmizləyin. Şəkillərinizi səliqəyə salmağın sadə və effektiv yolu.
  - title: Aylıq təmizlik
    description: Şəkillərinizə hər dəfə bir ay olmaqla baxın, hər şey səliqəli və idarə olunan qalsın. İrəliləyişiniz hər dəstə ilə yadda saxlanılır.
  - title: '"Bu gündə" xatirələri'
    description: Xüsusi anları yenidən yaşayın. "Bu gündə" funksiyası keçmiş illərin şəkillərini geri qaytarır ki, onlara baxıb qaydaya salasınız.
  - title: Səhvləri geri qaytarın
    description: Səhv sürüşdürdünüz? Problem deyil! Geri al düyməsinə toxunun və təsadüfən sildiyiniz şəkli dərhal geri qaytarın.
  - title: Son baxış
    description: Bitirməzdən əvvəl saxladığınız və sildiyiniz şəkillərə son dəfə nəzər salın, son anda dəyişiklik etmək imkanınız olsun.
  - title: İrəliləyiş izləyicisi
    description: Təmizlik prosesini irəliləyiş çarxı ilə izləyin. O, nə qədər baxdığınızı və nə qədər qaldığını göstərir.
