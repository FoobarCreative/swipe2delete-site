lang_name: Български
hreflang: bg
page_title: "Swipe2delete: Изтривайте снимки с плъзгане и разчистете фотогалерията си"
app_subtitle: Плъзнете, за да изтриете снимки и да разчистите галерията си
app_description: >-
  Swipe2delete е бързият и забавен инструмент за разчистване на снимки за iPhone
  и iPad. Плъзнете наляво, за да изтриете снимки, и надясно, за да ги запазите.
  Разчистете фотогалерията си месец по месец и освободете място.
features:
  - title: Плъзни и подреди
    description: Разчистете галерията си лесно. Плъзгане наляво изтрива, плъзгане надясно запазва. Прост и ефективен начин да подредите снимките си.
  - title: Месечно разчистване
    description: Преглеждайте снимките си месец по месец, подредено и без претоварване. Напредъкът ви се запазва след всяка порция.
  - title: Спомени „На този ден“
    description: Преживейте отново специалните моменти. Функцията „На този ден“ връща снимки от минали години, за да ги прегледате и подредите.
  - title: Отмяна на грешки
    description: Сгрешихте? Няма проблем! Докоснете „Отмени“ и веднага върнете случайно изтрита снимка.
  - title: Финален преглед
    description: Преди да приключите, вижте за последно снимките, които запазвате и изтривате, с възможност за промени в последния момент.
  - title: Проследяване на напредъка
    description: Следете разчистването с колелото на напредъка. То показва колко сте прегледали и колко остава.
