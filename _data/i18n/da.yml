lang_name: Dansk
hreflang: da
flag: "🇩🇰"
page_title: "Swipe2delete: swipe for at slette fotos og ryd op i din kamerarulle"
app_subtitle: Swipe for at slette fotos og ryd op i din kamerarulle
app_description: >-
  Swipe2delete er den hurtige og sjove fotooprydder til iPhone og iPad.
  Swipe til venstre for at slette fotos, og swipe til højre for at beholde dem.
  Ryd op i din kamerarulle én måned ad gangen, og frigør lagerplads.
features:
  - title: Swipe og ryd op
    description: Ryd nemt op i din kamerarulle ved at swipe til venstre for at slette eller til højre for at beholde. En enkel og effektiv måde at rydde op i dine fotos på.
  - title: Månedlig oprydning
    description: Tag dine fotos én måned ad gangen, overskueligt og overkommeligt. Din fremgang gemmes efter hver omgang.
  - title: På denne dag
    description: Genoplev særlige øjeblikke. Funktionen "På denne dag" henter fotos frem fra tidligere år, så du kan gennemgå og rydde op i dem.
  - title: Fortryd fejl
    description: Swipede du forkert? Intet problem! Tryk på fortryd, og få straks et foto tilbage, du kom til at slette.
  - title: Endelig gennemgang
    description: Inden du er færdig, får du et sidste kig på de fotos, du beholder og sletter, så du kan nå at ændre mening i sidste øjeblik.
  - title: Fremgangshjul
    description: Hold styr på din oprydning med fremgangshjulet, der viser, hvor meget du har været igennem, og hvad der mangler.
