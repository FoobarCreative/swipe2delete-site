lang_name: Deutsch
hreflang: de
page_title: "Swipe2delete: Fotos per Wisch löschen & Kamerarolle aufräumen"
app_subtitle: Wische, um Fotos zu löschen und deine Kamerarolle aufzuräumen
app_description: >-
  Swipe2delete ist der schnelle, unterhaltsame Foto-Cleaner für iPhone und iPad.
  Wische nach links, um Fotos zu löschen, und nach rechts, um sie zu behalten.
  Räume deine Kamerarolle Monat für Monat auf und schaffe freien Speicherplatz.
features:
  - title: Wischen und aufräumen
    description: Bereinige deine Kamerarolle ganz einfach, indem du nach links wischst, um zu löschen, oder nach rechts, um zu behalten. Der einfache und effiziente Weg, deine Fotos zu entrümpeln.
  - title: Monatliche Bereinigung
    description: Gehe deine Fotos Monat für Monat durch, übersichtlich und gut machbar. Dein Fortschritt wird bei jedem Durchgang gespeichert.
  - title: An diesem Tag
    description: Erlebe besondere Momente neu. Die Funktion "An diesem Tag" holt Fotos aus vergangenen Jahren zurück, damit du sie durchsehen und aufräumen kannst.
  - title: Fehler rückgängig machen
    description: Falsch gewischt? Kein Problem! Tippe auf Rückgängig und hole ein versehentlich gelöschtes Foto sofort zurück.
  - title: Abschließende Kontrolle
    description: Bevor du fertig bist, siehst du noch einmal alle Fotos, die du behältst und löschst, und kannst in letzter Sekunde etwas ändern.
  - title: Fortschrittsanzeige
    description: Behalte deinen Fortschritt mit dem Fortschrittsrad im Blick. Es zeigt dir, wie viel du schon geschafft hast und was noch übrig ist.
