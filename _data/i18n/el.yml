lang_name: Ελληνικά
hreflang: el
flag: "🇬🇷"
page_title: "Swipe2delete: Διαγράψτε φωτογραφίες με ένα σύρσιμο και καθαρίστε τη συλλογή σας"
app_subtitle: Σύρετε για να διαγράψετε φωτογραφίες και να καθαρίσετε τη συλλογή σας
app_description: >-
  Το Swipe2delete είναι το γρήγορο και διασκεδαστικό εργαλείο καθαρισμού
  φωτογραφιών για iPhone και iPad. Σύρετε αριστερά για να διαγράψετε φωτογραφίες
  και δεξιά για να τις κρατήσετε. Καθαρίστε τη συλλογή σας μήνα με τον μήνα και
  ελευθερώστε χώρο.
features:
  - title: Σύρετε και οργανώστε
    description: Καθαρίστε τη συλλογή σας εύκολα, σύροντας αριστερά για διαγραφή ή δεξιά για διατήρηση. Ένας απλός και αποτελεσματικός τρόπος να ξεκαθαρίσετε τις φωτογραφίες σας.
  - title: Μηνιαίος καθαρισμός
    description: Ξεκαθαρίστε τις φωτογραφίες σας μήνα με τον μήνα, οργανωμένα και χωρίς άγχος. Η πρόοδός σας αποθηκεύεται σε κάθε παρτίδα.
  - title: Αναμνήσεις «Σήμερα»
    description: Ξαναζήστε ξεχωριστές στιγμές. Η λειτουργία «Σήμερα» επαναφέρει φωτογραφίες από παλαιότερα χρόνια για να τις δείτε και να τις οργανώσετε.
  - title: Αναίρεση λαθών
    description: Κάνατε λάθος; Κανένα πρόβλημα! Πατήστε αναίρεση και επαναφέρετε αμέσως μια φωτογραφία που διαγράψατε κατά λάθος.
  - title: Τελικός έλεγχος
    description: Πριν ολοκληρώσετε, ρίξτε μια τελευταία ματιά στις φωτογραφίες που κρατάτε και διαγράφετε, με δυνατότητα αλλαγών της τελευταίας στιγμής.
  - title: Παρακολούθηση προόδου
    description: Παρακολουθήστε τον καθαρισμό σας με τον τροχό προόδου, που δείχνει πόσα έχετε ξεκαθαρίσει και τι απομένει.
