lang_name: Español
hreflang: es
flag: "🇪🇸"
page_title: "Swipe2delete: desliza para borrar fotos y limpiar tu carrete"
app_subtitle: Desliza para borrar fotos y limpiar tu carrete
app_description: >-
  Swipe2delete es el limpiador de fotos rápido y divertido para iPhone y iPad.
  Desliza a la izquierda para borrar fotos y a la derecha para conservarlas.
  Limpia tu carrete mes a mes y libera espacio de almacenamiento.
features:
  - title: Desliza para organizar
    description: Limpia tu carrete fácilmente deslizando a la izquierda para borrar o a la derecha para conservar. Una forma simple y eficiente de ordenar tus fotos.
  - title: Limpieza mensual
    description: Repasa tus fotos mes a mes, de forma organizada y manejable. Tu progreso se guarda con cada tanda.
  - title: Recuerdos de "Tal día como hoy"
    description: Revive momentos especiales. La función "Tal día como hoy" recupera fotos de años pasados para revisarlas y organizarlas.
  - title: Deshacer errores
    description: ¿Te equivocaste? ¡No pasa nada! Toca deshacer y recupera al instante una foto borrada por accidente.
  - title: Revisión final
    description: Antes de terminar, echa un último vistazo a las fotos que conservas y borras, con margen para cambios de última hora.
  - title: Seguimiento del progreso
    description: Controla tu limpieza con la rueda de progreso, que muestra cuánto has revisado y cuánto te queda.
