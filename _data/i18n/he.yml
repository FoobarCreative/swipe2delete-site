lang_name: עברית
hreflang: he
flag: "🇮🇱"
rtl: true
page_title: "Swipe2delete: החליקו כדי למחוק תמונות ולנקות את גליל הצילום"
app_subtitle: החליקו כדי למחוק תמונות ולנקות את גליל הצילום
app_description: >-
  Swipe2delete הוא מנקה התמונות המהיר והכיפי ל-iPhone ול-iPad.
  החליקו שמאלה כדי למחוק תמונות וימינה כדי לשמור אותן.
  נקו את גליל הצילום חודש אחר חודש ופנו מקום אחסון.
features:
  - title: החליקו כדי לסדר
    description: נקו את גליל הצילום בקלות בהחלקה שמאלה למחיקה או ימינה לשמירה. דרך פשוטה ויעילה לעשות סדר בתמונות.
  - title: ניקוי חודשי
    description: עברו על התמונות חודש אחר חודש, בצורה מסודרת ונוחה. ההתקדמות שלכם נשמרת בכל סבב.
  - title: זיכרונות "ביום הזה"
    description: חיו מחדש רגעים מיוחדים. התכונה "ביום הזה" מחזירה תמונות משנים עברו כדי לעבור עליהן ולסדר אותן.
  - title: ביטול טעויות
    description: החלקתם בטעות? אין בעיה! הקישו על ביטול והחזירו מיד תמונה שנמחקה בטעות.
  - title: סקירה סופית
    description: לפני שמסיימים, מקבלים מבט אחרון על התמונות שאתם שומרים ומוחקים, עם אפשרות לשינויים של הרגע האחרון.
  - title: מעקב התקדמות
    description: עקבו אחרי הניקוי עם גלגל ההתקדמות, שמראה כמה כבר מיינתם ומה נשאר.
