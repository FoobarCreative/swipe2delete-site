lang_name: हिन्दी
hreflang: hi
page_title: "Swipe2delete: स्वाइप करके फ़ोटो डिलीट करें और कैमरा रोल साफ़ करें"
app_subtitle: स्वाइप करके फ़ोटो डिलीट करें और अपना कैमरा रोल साफ़ रखें
app_description: >-
  Swipe2delete iPhone और iPad के लिए तेज़ और मज़ेदार फ़ोटो क्लीनर है।
  बाईं ओर स्वाइप करके फ़ोटो डिलीट करें, दाईं ओर स्वाइप करके रखें।
  अपना कैमरा रोल एक बार में एक महीना करके साफ़ करें और स्टोरेज खाली करें।
features:
  - title: स्वाइप करके व्यवस्थित करें
    description: बाईं ओर स्वाइप करके डिलीट करें या दाईं ओर स्वाइप करके रखें, और कैमरा रोल आसानी से साफ़ करें। फ़ोटो व्यवस्थित करने का सरल और असरदार तरीक़ा।
  - title: महीने-दर-महीने सफ़ाई
    description: अपनी फ़ोटो एक बार में एक महीना करके निपटाएँ, सब कुछ व्यवस्थित और आसान रहता है। हर बैच के साथ आपकी प्रगति सेव होती जाती है।
  - title: उस दिन की यादें
    description: पिछले सालों की उसी तारीख़ की फ़ोटो वापस लाकर "उस दिन" फ़ीचर आपको ख़ास पलों को फिर से जीने और उन्हें व्यवस्थित करने का मौक़ा देता है।
  - title: ग़लती हो जाए तो अनडू करें
    description: कोई ग़लती हो गई? कोई बात नहीं! एक टैप से कोई भी ऐक्शन अनडू करें और ग़लती से डिलीट हुई फ़ोटो वापस पाएँ।
  - title: अंतिम समीक्षा
    description: पूरा करने से पहले, रखी जा रही और डिलीट हो रही फ़ोटो पर एक आख़िरी नज़र डालें, आख़िरी पल तक बदलाव कर सकते हैं।
  - title: प्रगति ट्रैकर
    description: प्रगति व्हील के साथ अपनी सफ़ाई की यात्रा पर नज़र रखें, जो दिखाता है कि आपने कितना छाँट लिया और कितना बाक़ी है।
