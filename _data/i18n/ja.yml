lang_name: 日本語
hreflang: ja
page_title: "Swipe2delete: スワイプで写真を削除してカメラロールを整理"
app_subtitle: スワイプで写真を削除、カメラロールをすっきり整理
app_description: >-
  Swipe2deleteは、iPhoneとiPad向けの速くて楽しい写真クリーナーです。
  左にスワイプで写真を削除、右にスワイプで残す。
  カメラロールを1か月ずつ整理して、ストレージの空き容量を増やしましょう。
features:
  - title: スワイプで整理
    description: 左にスワイプで削除、右にスワイプで残す。シンプルで効率的に、カメラロールをすっきり片付けられます。
  - title: 月ごとのクリーンアップ
    description: 写真を1か月ずつ整理するので、無理なく続けられます。進み具合はそのつど保存されます。
  - title: 「この日の思い出」
    description: 「この日の思い出」機能で、過去の同じ日の写真がよみがえります。懐かしい写真を見返しながら整理できます。
  - title: 取り消しでやり直し
    description: 間違えても大丈夫！タップひとつで直前の操作を取り消して、うっかり削除した写真を戻せます。
  - title: 最終確認
    description: 仕上げの前に、残す写真と削除する写真をもう一度確認。最後の最後まで変更できます。
  - title: 進捗トラッカー
    description: 進捗ホイールで、どこまで整理できたか、あとどれくらい残っているかがひと目でわかります。
