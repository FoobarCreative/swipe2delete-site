lang_name: Қазақша
hreflang: kk
flag: "🇰🇿"
page_title: "Swipe2delete: сырғытып фотоларды жойыңыз және галереяны тазалаңыз"
app_subtitle: Сырғытып фотоларды жойыңыз және галереяңызды тазалаңыз
app_description: >-
  Swipe2delete - iPhone мен iPad-қа арналған жылдам әрі қызықты фото тазалағыш.
  Фотоны жою үшін солға, сақтау үшін оңға сырғытыңыз.
  Галереяңызды ай сайын тазалап, жад орнын босатыңыз.
features:
  - title: Сырғытып реттеңіз
    description: Жою үшін солға, сақтау үшін оңға сырғытып, галереяңызды оңай тазалаңыз. Фотоларды ретке келтірудің қарапайым да тиімді жолы.
  - title: Ай сайынғы тазалау
    description: Фотоларыңызды ай-айымен қарап шығыңыз, бәрі реттелген әрі жеңіл болады. Прогресіңіз әр топтамамен сақталып отырады.
  - title: '"Осы күні" естеліктері'
    description: Ерекше сәттерді қайта өткеріңіз. "Осы күні" функциясы өткен жылдардағы фотоларды қайта көрсетіп, оларды қарап, реттеуге мүмкіндік береді.
  - title: Қателерді болдырмау
    description: Қате сырғыттыңыз ба? Уайымдамаңыз! Болдырмау түймесін басып, байқаусызда жойылған фотоны бірден қайтарыңыз.
  - title: Соңғы тексеру
    description: Аяқтамас бұрын сақтайтын және жоятын фотоларға соңғы рет көз жүгіртіп, соңғы сәтте өзгерістер енгізе аласыз.
  - title: Прогресс трекері
    description: Тазалау барысын прогресс дөңгелегімен қадағалаңыз. Ол қаншасын қарап шыққаныңызды және қаншасы қалғанын көрсетеді.
