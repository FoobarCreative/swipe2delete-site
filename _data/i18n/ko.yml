lang_name: 한국어
hreflang: ko
flag: "🇰🇷"
page_title: "Swipe2delete: 스와이프로 사진을 삭제하고 카메라 롤을 정리"
app_subtitle: 스와이프로 사진을 삭제하고 카메라 롤을 깔끔하게
app_description: >-
  Swipe2delete는 iPhone과 iPad를 위한 빠르고 재미있는 사진 정리 앱입니다.
  왼쪽으로 스와이프하면 삭제, 오른쪽으로 스와이프하면 유지됩니다.
  카메라 롤을 한 달씩 정리하면서 저장 공간을 확보해 보세요.
features:
  - title: 스와이프로 정리
    description: 왼쪽으로 스와이프해 삭제하고, 오른쪽으로 스와이프해 남기세요. 카메라 롤을 간단하고 효율적으로 정리할 수 있습니다.
  - title: 월별 클린업
    description: 사진을 한 달씩 나눠 정리하니 부담 없이 차근차근 진행할 수 있습니다. 진행 상황은 그때그때 저장됩니다.
  - title: 그날의 추억
    description: 지난 몇 년 전 같은 날짜의 사진을 다시 만나 보세요. '그날의 추억' 기능으로 소중한 순간을 되새기며 정리할 수 있습니다.
  - title: 실수해도 취소
    description: 실수했나요? 걱정 마세요! 한 번의 탭으로 방금 한 동작을 취소하고, 실수로 삭제한 사진을 되돌릴 수 있습니다.
  - title: 최종 확인
    description: 마무리하기 전에 남길 사진과 삭제할 사진을 한 번 더 확인하고, 마지막 순간까지 변경할 수 있습니다.
  - title: 진행 상황 트래커
    description: 진행 휠로 지금까지 얼마나 정리했는지, 얼마나 남았는지 한눈에 확인할 수 있습니다.
