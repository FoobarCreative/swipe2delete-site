lang_name: Lietuvių
hreflang: lt
page_title: "Swipe2delete: braukite, kad ištrintumėte nuotraukas ir išvalytumėte galeriją"
app_subtitle: Braukite, kad ištrintumėte nuotraukas ir išvalytumėte galeriją
app_description: >-
  Swipe2delete yra greitas ir smagus nuotraukų valiklis, skirtas iPhone ir iPad.
  Braukite kairėn, kad ištrintumėte nuotraukas, ir dešinėn, kad jas pasiliktumėte.
  Tvarkykite galeriją po vieną mėnesį ir atlaisvinkite vietos saugykloje.
features:
  - title: Braukite ir tvarkykite
    description: Lengvai išvalykite galeriją braukdami kairėn, kad ištrintumėte, arba dešinėn, kad pasiliktumėte. Paprastas ir efektyvus būdas susitvarkyti nuotraukas.
  - title: Mėnesinis valymas
    description: Peržiūrėkite nuotraukas po vieną mėnesį, tvarkingai ir be streso. Jūsų pažanga išsaugoma su kiekviena partija.
  - title: Prisiminimai "Šiandienos data"
    description: Išgyvenkite ypatingas akimirkas iš naujo. Funkcija "Šiandienos data" sugrąžina praėjusių metų nuotraukas, kad galėtumėte jas peržiūrėti ir susitvarkyti.
  - title: Atšaukite klaidas
    description: Suklydote? Nieko tokio! Palieskite atšaukimo mygtuką ir akimirksniu susigrąžinkite netyčia ištrintą nuotrauką.
  - title: Galutinė peržiūra
    description: Prieš baigdami dar kartą peržiūrėkite, kurias nuotraukas paliekate ir kurias trinate, ir prireikus pakeiskite sprendimą paskutinę akimirką.
  - title: Pažangos sekimas
    description: Stebėkite savo tvarkymąsi pažangos rate, kuris rodo, kiek jau peržiūrėjote ir kiek liko.
