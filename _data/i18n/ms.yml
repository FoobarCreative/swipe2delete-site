lang_name: Bahasa Melayu
hreflang: ms
flag: "🇲🇾"
page_title: "Swipe2delete: Leret untuk Memadam Foto dan Mengemas Galeri"
app_subtitle: Leret untuk memadam foto dan mengemas galeri anda
app_description: >-
  Swipe2delete ialah pembersih foto yang pantas dan menyeronokkan untuk iPhone dan iPad.
  Leret ke kiri untuk memadam foto, leret ke kanan untuk menyimpannya.
  Kemaskan galeri foto anda bulan demi bulan dan bebaskan ruang storan.
features:
  - title: Leret untuk Mengemas
    description: Bersihkan galeri foto dengan mudah, leret ke kiri untuk memadam atau ke kanan untuk menyimpan. Cara mudah dan cekap untuk mengemas foto anda.
  - title: Pembersihan Bulanan
    description: Uruskan foto anda sebulan demi sebulan, sentiasa teratur dan mudah dikawal. Kemajuan anda disimpan pada setiap sesi.
  - title: Kenangan Pada Hari Ini
    description: Imbas kembali detik istimewa dengan ciri "Pada Hari Ini" yang membawa kembali foto dari tahun-tahun lalu untuk disemak dan dikemas.
  - title: Buat Asal Kesilapan
    description: Tersilap leret? Jangan risau! Ketik untuk buat asal sebarang tindakan dan kembalikan foto yang terpadam secara tidak sengaja.
  - title: Semakan Terakhir
    description: Sebelum selesai, lihat sekali lagi foto yang akan disimpan dan dipadam, anda masih boleh mengubah fikiran pada saat akhir.
  - title: Penjejak Kemajuan
    description: Pantau perjalanan pembersihan anda dengan roda kemajuan yang menunjukkan berapa banyak yang telah disusun dan apa yang berbaki.
