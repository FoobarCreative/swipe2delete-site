lang_name: Nederlands
hreflang: nl
page_title: "Swipe2delete: veeg foto's weg en ruim je filmrol op"
app_subtitle: Veeg om foto's te verwijderen en je filmrol op te ruimen
app_description: >-
  Swipe2delete is de snelle, leuke fotocleaner voor iPhone en iPad.
  Veeg naar links om foto's te verwijderen en naar rechts om ze te bewaren.
  Ruim je filmrol maand voor maand op en maak opslagruimte vrij.
features:
  - title: Vegen en opruimen
    description: Ruim je filmrol eenvoudig op door naar links te vegen om te verwijderen of naar rechts om te bewaren. Een simpele en efficiënte manier om je foto's op te schonen.
  - title: Maandelijkse opruimbeurt
    description: Pak je foto's maand voor maand aan, overzichtelijk en behapbaar. Je voortgang wordt bij elke ronde bewaard.
  - title: Op deze dag
    description: Herbeleef bijzondere momenten. De functie "Op deze dag" haalt foto's van voorgaande jaren terug, zodat je ze kunt doornemen en opruimen.
  - title: Fouten ongedaan maken
    description: Verkeerd geveegd? Geen probleem! Tik op ongedaan maken en haal een per ongeluk verwijderde foto meteen terug.
  - title: Laatste controle
    description: Voordat je klaar bent, zie je nog één keer alle foto's die je bewaart en verwijdert, zodat je op het laatste moment nog iets kunt aanpassen.
  - title: Voortgang bijhouden
    description: Houd je voortgang in de gaten met het voortgangswiel. Zo zie je hoeveel je al hebt gedaan en wat er nog overblijft.
