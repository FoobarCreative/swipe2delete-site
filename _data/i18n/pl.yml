lang_name: Polski
hreflang: pl
flag: "🇵🇱"
page_title: "Swipe2delete: usuwaj zdjęcia przesunięciem i uporządkuj rolkę aparatu"
app_subtitle: Przesuń, aby usuwać zdjęcia i uporządkować rolkę aparatu
app_description: >-
  Swipe2delete to szybka i przyjemna aplikacja do czyszczenia zdjęć na iPhone'a i iPada.
  Przesuń w lewo, aby usunąć zdjęcie, i w prawo, aby je zachować.
  Porządkuj rolkę aparatu miesiąc po miesiącu i zwalniaj miejsce.
features:
  - title: Przesuwaj i porządkuj
    description: Z łatwością uporządkuj rolkę aparatu. Przesuń w lewo, aby usunąć, lub w prawo, aby zachować. Prosty i skuteczny sposób na odgracenie zdjęć.
  - title: Comiesięczne porządki
    description: Przeglądaj zdjęcia miesiąc po miesiącu, w uporządkowany i wykonalny sposób. Twój postęp jest zapisywany po każdej sesji.
  - title: W tym dniu
    description: Przeżyj wyjątkowe chwile na nowo. Funkcja "W tym dniu" przywołuje zdjęcia z minionych lat do przejrzenia i uporządkowania.
  - title: Cofaj pomyłki
    description: Przesunięcie w złą stronę? Żaden problem! Stuknij cofnij, a przypadkowo usunięte zdjęcie natychmiast wróci.
  - title: Ostateczny przegląd
    description: Zanim skończysz, zobaczysz jeszcze raz wszystkie zdjęcia, które zachowujesz i usuwasz, z możliwością zmian w ostatniej chwili.
  - title: Śledzenie postępu
    description: Miej porządki pod kontrolą dzięki kołu postępu, które pokazuje, ile już za Tobą i ile jeszcze zostało.
