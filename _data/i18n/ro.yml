lang_name: Română
hreflang: ro
flag: "🇷🇴"
page_title: "Swipe2delete: Șterge poze cu o glisare și fă curat în galeria foto"
app_subtitle: Glisează pentru a șterge poze și a face curat în galeria foto
app_description: >-
  Swipe2delete este aplicația rapidă și distractivă de curățare a pozelor pentru
  iPhone și iPad. Glisează la stânga pentru a șterge poze și la dreapta pentru a
  le păstra. Fă curat în galeria foto lună de lună și eliberează spațiu.
features:
  - title: Glisează și organizează
    description: Fă curat în galeria foto simplu. Glisează la stânga pentru a șterge sau la dreapta pentru a păstra. Un mod simplu și eficient de a scăpa de pozele în plus.
  - title: Curățenie lunară
    description: Ocupă-te de poze lună de lună, totul rămâne organizat și ușor de gestionat. Progresul se salvează la fiecare rundă.
  - title: Amintiri „În această zi”
    description: Retrăiește momentele speciale. Funcția „În această zi” readuce poze din anii trecuți, ca să le revezi și să le organizezi.
  - title: Anulează greșelile
    description: Ai greșit? Nicio problemă! Atinge Anulează și recuperezi imediat o poză ștearsă din greșeală.
  - title: Verificare finală
    description: Înainte să termini, arunci o ultimă privire la pozele păstrate și șterse, cu posibilitatea de a schimba ceva în ultimul moment.
  - title: Urmărirea progresului
    description: Urmărește curățenia cu roata de progres. Îți arată cât ai sortat și cât a mai rămas.
