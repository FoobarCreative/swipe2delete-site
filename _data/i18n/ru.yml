lang_name: Русский
hreflang: ru
page_title: "Swipe2delete: удаляйте фото свайпом и наводите порядок в фотопленке"
app_subtitle: Свайпайте, чтобы удалять фото и очистить фотопленку
app_description: >-
  Swipe2delete: быстрый и увлекательный очиститель фото для iPhone и iPad.
  Свайпните влево, чтобы удалить фото, и вправо, чтобы оставить его.
  Наводите порядок в фотопленке месяц за месяцем и освобождайте место.
features:
  - title: Свайпай и наводи порядок
    description: Очищайте фотопленку легко. Свайп влево удаляет фото, свайп вправо оставляет. Простой и эффективный способ разобрать снимки.
  - title: Уборка по месяцам
    description: Разбирайте фото месяц за месяцем, аккуратно и без перегрузки. Прогресс сохраняется после каждой партии.
  - title: В этот день
    description: Переживайте особенные моменты заново. Функция «В этот день» возвращает фото прошлых лет, чтобы вы могли их пересмотреть и разобрать.
  - title: Отмена ошибок
    description: Свайпнули не туда? Не беда! Нажмите «Отменить» и мгновенно верните случайно удаленное фото.
  - title: Финальная проверка
    description: Перед завершением вы еще раз увидите все фото, которые оставляете и удаляете, и сможете передумать в последний момент.
  - title: Отслеживание прогресса
    description: Следите за уборкой с помощью колеса прогресса. Оно показывает, сколько уже разобрано и сколько осталось.
