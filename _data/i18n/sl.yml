lang_name: Slovenščina
hreflang: sl
page_title: "Swipe2delete: podrsajte za brisanje fotografij in očistite galerijo"
app_subtitle: Podrsajte za brisanje fotografij in očistite svojo galerijo
app_description: >-
  Swipe2delete je hiter in zabaven čistilec fotografij za iPhone in iPad.
  Podrsajte levo, da fotografijo izbrišete, in desno, da jo obdržite.
  Očistite galerijo mesec za mesecem in sprostite prostor za shranjevanje.
features:
  - title: Podrsajte in uredite
    description: Preprosto očistite galerijo s podrsavanjem levo za izbris ali desno, da fotografijo obdržite. Preprost in učinkovit način za urejanje fotografij.
  - title: Mesečno čiščenje
    description: Fotografije pregledujte mesec za mesecem, pregledno in obvladljivo. Vaš napredek se shrani z vsakim sklopom.
  - title: Spomini "Na ta dan"
    description: Podoživite posebne trenutke. Funkcija "Na ta dan" prikliče fotografije iz preteklih let, da jih pregledate in uredite.
  - title: Razveljavite napake
    description: Ste se zmotili? Nič hudega! Tapnite razveljavi in takoj povrnite fotografijo, ki ste jo pomotoma izbrisali.
  - title: Končni pregled
    description: Preden končate, si še zadnjič oglejte fotografije, ki jih obdržite in izbrišete, z možnostjo sprememb v zadnjem trenutku.
  - title: Sledenje napredku
    description: Spremljajte svoje čiščenje s kolesom napredka, ki prikazuje, koliko ste že pregledali in koliko vam še ostane.
