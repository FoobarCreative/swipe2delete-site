lang_name: Svenska
hreflang: sv
page_title: "Swipe2delete: svep för att radera bilder och rensa din kamerarulle"
app_subtitle: Svep för att radera bilder och rensa din kamerarulle
app_description: >-
  Swipe2delete är den snabba och roliga fotorensaren för iPhone och iPad.
  Svep vänster för att radera bilder och höger för att behålla dem.
  Rensa din kamerarulle en månad i taget och frigör lagringsutrymme.
features:
  - title: Svep och rensa
    description: Rensa din kamerarulle enkelt genom att svepa vänster för att radera eller höger för att behålla. Ett enkelt och effektivt sätt att rensa bland dina bilder.
  - title: Månadsvis rensning
    description: Ta dig igenom dina bilder en månad i taget, överskådligt och hanterbart. Dina framsteg sparas efter varje omgång.
  - title: På denna dag
    description: Återupplev speciella ögonblick. Funktionen "På denna dag" tar fram bilder från tidigare år så att du kan gå igenom och rensa dem.
  - title: Ångra misstag
    description: Svepte du fel? Ingen fara! Tryck på ångra så är bilden du råkade radera tillbaka direkt.
  - title: Slutlig granskning
    description: Innan du är klar får du en sista titt på alla bilder du behåller och raderar, så att du kan ändra dig i sista stund.
  - title: Framstegshjul
    description: Håll koll på dina framsteg med framstegshjulet. Det visar hur mycket du har gått igenom och vad som återstår.
