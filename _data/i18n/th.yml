lang_name: ไทย
hreflang: th
page_title: "Swipe2delete: ปัดเพื่อลบรูปภาพและเคลียร์คลังรูปของคุณ"
app_subtitle: ปัดเพื่อลบรูปภาพและจัดระเบียบคลังรูปของคุณ
app_description: >-
  Swipe2delete คือแอปล้างรูปภาพที่รวดเร็วและสนุกสำหรับ iPhone และ iPad
  ปัดซ้ายเพื่อลบรูป ปัดขวาเพื่อเก็บไว้
  จัดระเบียบคลังรูปทีละเดือน แล้วเพิ่มพื้นที่จัดเก็บให้เครื่องของคุณ
features:
  - title: ปัดเพื่อจัดระเบียบ
    description: เคลียร์คลังรูปได้ง่ายๆ แค่ปัดซ้ายเพื่อลบหรือปัดขวาเพื่อเก็บไว้ วิธีจัดการรูปภาพที่เรียบง่ายและมีประสิทธิภาพ
  - title: เคลียร์ทีละเดือน
    description: จัดการรูปภาพทีละเดือน เป็นระเบียบและไม่หนักเกินไป ความคืบหน้าของคุณจะถูกบันทึกไว้ทุกรอบ
  - title: ความทรงจำวันนี้ในอดีต
    description: ย้อนรำลึกช่วงเวลาพิเศษกับฟีเจอร์ "วันนี้ในอดีต" ที่นำรูปจากปีก่อนๆ กลับมาให้คุณดูและจัดระเบียบ
  - title: เลิกทำเมื่อพลาด
    description: ปัดพลาดเหรอ? ไม่ต้องกังวล! แตะเลิกทำเพื่อย้อนการกระทำล่าสุดและกู้รูปที่เผลอลบกลับมาได้ทันที
  - title: ตรวจทานครั้งสุดท้าย
    description: ก่อนเสร็จสิ้น คุณจะได้ดูรูปที่จะเก็บและจะลบอีกครั้ง เปลี่ยนใจได้จนถึงวินาทีสุดท้าย
  - title: ติดตามความคืบหน้า
    description: วงล้อความคืบหน้าแสดงให้เห็นว่าคุณจัดระเบียบไปแล้วเท่าไรและเหลืออีกแค่ไหน เห็นภาพรวมได้ทันที
