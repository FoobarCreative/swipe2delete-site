lang_name: Українська
hreflang: uk
flag: "🇺🇦"
page_title: "Swipe2delete: видаляйте фото свайпом і наводьте лад у фотоплівці"
app_subtitle: Свайпайте, щоб видаляти фото й очистити фотоплівку
app_description: >-
  Swipe2delete: швидкий і захопливий очищувач фото для iPhone та iPad.
  Свайпніть вліво, щоб видалити фото, і вправо, щоб залишити його.
  Наводьте лад у фотоплівці місяць за місяцем і звільняйте місце.
features:
  - title: Свайпай і наводь лад
    description: Очищуйте фотоплівку легко. Свайп вліво видаляє фото, свайп вправо залишає. Простий і ефективний спосіб розібрати знімки.
  - title: Прибирання за місяцями
    description: Розбирайте фото місяць за місяцем, акуратно й без перевантаження. Прогрес зберігається після кожної партії.
  - title: Цього дня
    description: Переживайте особливі моменти знову. Функція «Цього дня» повертає фото минулих років, щоб ви могли їх переглянути й розібрати.
  - title: Скасування помилок
    description: Свайпнули не туди? Не біда! Натисніть «Скасувати» і миттєво поверніть випадково видалене фото.
  - title: Фінальна перевірка
    description: Перед завершенням ви ще раз побачите всі фото, які залишаєте та видаляєте, і зможете передумати в останню мить.
  - title: Відстеження прогресу
    description: Стежте за прибиранням за допомогою колеса прогресу. Воно показує, скільки вже розібрано і скільки залишилося.
