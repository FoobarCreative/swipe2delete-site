lang_name: Tiếng Việt
hreflang: vi
flag: "🇻🇳"
page_title: "Swipe2delete: Vuốt để xóa ảnh và dọn dẹp thư viện ảnh"
app_subtitle: Vuốt để xóa ảnh và dọn dẹp thư viện ảnh của bạn
app_description: >-
  Swipe2delete là ứng dụng dọn ảnh nhanh và thú vị cho iPhone và iPad.
  Vuốt sang trái để xóa ảnh, vuốt sang phải để giữ lại.
  Dọn dẹp thư viện ảnh theo từng tháng và giải phóng dung lượng.
features:
  - title: Vuốt để sắp xếp
    description: Dọn dẹp thư viện ảnh thật dễ dàng, chỉ cần vuốt sang trái để xóa hoặc sang phải để giữ lại. Cách đơn giản và hiệu quả để kho ảnh của bạn luôn gọn gàng.
  - title: Dọn dẹp theo tháng
    description: Xử lý ảnh theo từng tháng một, gọn gàng và vừa sức. Tiến độ của bạn được lưu lại sau mỗi đợt.
  - title: Kỷ niệm ngày này năm xưa
    description: Sống lại những khoảnh khắc đặc biệt với tính năng "Ngày này năm xưa", đưa những bức ảnh từ các năm trước quay lại để bạn xem và sắp xếp.
  - title: Hoàn tác khi lỡ tay
    description: Lỡ vuốt nhầm? Đừng lo! Chạm để hoàn tác thao tác vừa rồi và lấy lại bức ảnh bạn vô tình xóa.
  - title: Xem lại lần cuối
    description: Trước khi hoàn tất, bạn sẽ xem lại toàn bộ ảnh giữ và ảnh xóa, thoải mái thay đổi vào phút chót.
  - title: Theo dõi tiến độ
    description: Vòng tròn tiến độ cho bạn thấy đã dọn được bao nhiêu và còn lại bao nhiêu, hành trình dọn dẹp luôn rõ ràng.
