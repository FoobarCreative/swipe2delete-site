{% assign c_lang = page.lang | default: 'en' %}
{% assign c = site.data.contact[c_lang] | default: site.data.contact['en'] %}
{% assign c_i18n = site.data.i18n[page.lang] %}
<h1>{{ c.title }}</h1>
<p id="contact-intro">{{ c.intro }}</p>

<form action="https://formspree.io/f/{{ site.formspree_form_id }}" method="POST" target="_self" id="contact-form">
<div class="form-group row">
<div class="col-md-6">
<input class="form-control" type="text" name="name" placeholder="{{ c.name }}*" required>
</div>
<div class="col-md-6">
<input class="form-control" type="email" name="_replyto" placeholder="{{ c.email }}*" required>
</div>
</div>

<textarea rows="8" class="form-control mb-3" name="message" placeholder="{{ c.message }}*" required></textarea>
<input type="hidden" name="_subject" id="contact-subject" value="{{ site.app_name | default: 'Swipe2delete' }} website contact">
<input type="hidden" name="_language" value="{{ c_i18n.hreflang | default: 'en' }}">
<input type="hidden" name="lang" id="contact-lang" value="{{ c_lang }}">
<div id="contact-diagnostics" hidden></div>
<p class="text-muted small mb-3" id="diag-note" hidden></p>
<p class="contact-error" id="contact-error" role="alert" hidden></p>
<input class="btn btn-dark" type="submit" id="contact-send" value="{{ c.send }}">
</form>
<div id="contact-thanks" hidden>
<p>{{ c.thanks }}</p>
<p id="contact-thanks-inapp" hidden>{{ c.thanks_inapp }}</p>
</div>

<script>
(function () {
  // The app opens this page as /contact?source=review_ask&app=...&version=...&device=...&ios=...&install_id=...&rcid=...&lang=...
  // Each value present is posted as a hidden field with the same name, so support keeps the device info and IDs.
  var params = new URLSearchParams(window.location.search);
  function clean(key, max) {
    var v = params.get(key);
    if (!v) { return ''; }
    return v.replace(/[^\w .,:$()+-]/g, '').trim().slice(0, max);
  }
  var fields = [['source', 40], ['app', 60], ['version', 40], ['device', 40], ['ios', 20], ['install_id', 64], ['rcid', 80]];
  var holder = document.getElementById('contact-diagnostics');
  var values = {};
  fields.forEach(function (f) {
    var v = clean(f[0], f[1]);
    if (!v) { return; }
    values[f[0]] = v;
    var input = document.createElement('input');
    input.type = 'hidden';
    input.name = f[0];
    input.value = v;
    holder.appendChild(input);
  });
  var lang = clean('lang', 10);
  if (lang) { document.getElementById('contact-lang').value = lang; }
  if (values.app || values.source) {
    document.getElementById('contact-subject').value =
      (values.app || '{{ site.app_name | default: "Swipe2delete" }}') + ' support request' + (values.source ? ' (' + values.source + ')' : '');
  }
  var summary = [];
  if (values.version) { summary.push('v' + values.version); }
  if (values.device) { summary.push(values.device); }
  if (values.ios) { summary.push('iOS ' + values.ios); }
  if (summary.length || values.install_id || values.rcid) {
    var note = document.getElementById('diag-note');
    note.textContent = {{ c.diag_note | jsonify }} + (summary.length ? ': ' + summary.join(', ') : '') + '.';
    note.hidden = false;
  }

  // Submit with fetch so the user stays on this page. Without JavaScript the plain POST above still works.
  if (!window.fetch || !window.FormData) { return; }
  var form = document.getElementById('contact-form');
  var send = document.getElementById('contact-send');
  var error = document.getElementById('contact-error');
  var sendLabel = send.value;
  var inApp = params.get('inapp') === 'true' || document.documentElement.classList.contains('in-app-view');
  form.addEventListener('submit', function (event) {
    event.preventDefault();
    error.hidden = true;
    send.disabled = true;
    send.value = {{ c.sending | jsonify }};
    fetch(form.action, {
      method: 'POST',
      body: new FormData(form),
      headers: { 'Accept': 'application/json' }
    }).then(function (response) {
      return response.json().catch(function () { return {}; }).then(function (data) {
        if (response.ok && data.ok !== false) { return data; }
        var reasons = [];
        if (data.errors && data.errors.length) {
          data.errors.forEach(function (e) { reasons.push((e.field ? e.field + ' ' : '') + (e.message || '')); });
        } else if (data.error) {
          reasons.push(data.error);
        }
        throw new Error(reasons.join('. '));
      });
    }).then(function () {
      form.hidden = true;
      document.getElementById('contact-intro').hidden = true;
      document.getElementById('contact-thanks-inapp').hidden = !inApp;
      document.getElementById('contact-thanks').hidden = false;
    }).catch(function (err) {
      var reason = err && err.message ? err.message.replace(/\.?$/, '.') : '';
      error.textContent = {{ c.error | jsonify }} + (reason && reason !== '.' ? ' ' + reason : '');
      error.hidden = false;
      send.disabled = false;
      send.value = sendLabel;
    });
  });
})();
</script>
