<style>
  /* Extra room below the content so the page bottom clears the iPhone home indicator in the in-app view */
  .subPageBody .page {
    padding-bottom: 80px;
  }
</style>

{% assign faq_lang = page.lang | default: 'en' %}
{% assign faq = site.data.faq[faq_lang] | default: site.data.faq['en'] %}

<h1>{{ faq.title }}</h1>

{% for item in faq.items %}
<h3>{{ item.q }}</h3>
{{ item.a | markdownify }}
{% endfor %}

<hr>

{{ faq.outro | markdownify }}

<a class="appStoreLink" href="{{ site.appstore_link | replace: 'ct=website', 'ct=faq' }}"><img class="appStore" src="{{ '/assets/appstore.png' | relative_url }}" alt="Download Swipe2delete on the App Store"></a>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {% for item in faq.items %}
    {
      "@type": "Question",
      "name": {{ item.q | jsonify }},
      "acceptedAnswer": {
        "@type": "Answer",
        "text": {{ item.a | markdownify | strip_html | normalize_whitespace | jsonify }}
      }
    }{% unless forloop.last %},{% endunless %}
    {% endfor %}
  ]
}
</script>
